<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Figma Token Replacer</title>
  <style>
    /* ── Light theme tokens (default) ── */
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --surface-hover: #f8f8f8;
      --surface-subtle: #f8f9fa;
      --border: #e8e8e8;
      --border-input: #e0e0e0;
      --text-primary: #0F1C2E;
      --text-secondary: #666;
      --text-muted: #999;
      --text-body: #333;
      --accent: #1E90FF;
      --accent-bg: #eef6ff;
      --pill-bg: #f5f5f5;
      --collection-bg: #f8f9fa;
      --drag-handle: #ccc;
    }

    /* ── Dark theme tokens ── */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --surface: #2c2c2c;
        --surface-hover: #363636;
        --surface-subtle: #333333;
        --border: #3d3d3d;
        --border-input: #444444;
        --text-primary: #f0f0f0;
        --text-secondary: #aaaaaa;
        --text-muted: #777777;
        --text-body: #cccccc;
        --accent: #4da6ff;
        --accent-bg: #1a2d40;
        --pill-bg: #383838;
        --collection-bg: #333333;
        --drag-handle: #555;
      }
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      background-color: var(--bg);
      color: var(--text-primary);
    }
    * {
      box-sizing: border-box;
    }
    #root {
      width: 100%;
      height: 100vh;
      padding: 0;
      overflow: hidden;
    }
    .logo {
      width: 32px;
      height: 32px;
      background-color: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 24px;
    }
    .upload-container {
      border: 2px dashed var(--border-input);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      background-color: var(--surface);
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-container:hover {
      border-color: var(--accent);
      background-color: var(--accent-bg);
    }
    .file-icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.6;
    }
    .button-primary {
      width: 100%;
      padding: 14px 24px;
      font-size: 13px;
      font-weight: 600;
      background-color: var(--text-primary);
      color: var(--bg);
      border-radius: 8px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      margin-top: 20px;
    }
    .button-primary:hover {
      opacity: 0.85;
    }
    .button-secondary {
      width: 100%;
      padding: 14px 24px;
      font-size: 13px;
      font-weight: 600;
      background-color: var(--surface);
      color: var(--text-body);
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border-input);
      transition: all 0.2s;
      margin-top: 12px;
    }
    .button-secondary:hover {
      background-color: var(--surface-hover);
    }
    .token-card {
      background-color: var(--surface);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .token-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 12px;
      word-break: break-word;
    }
    .token-details {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .token-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background-color: var(--pill-bg);
      border-radius: 6px;
      font-size: 11px;
      font-family: 'SF Mono', Monaco, 'Courier New', monospace;
      color: var(--text-primary);
    }
    .token-label {
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 600;
    }
    .section-header {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stats-line {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      color: var(--text-body);
    }
    .success-icon {
      width: 80px;
      height: 80px;
      background-color: #4CAF50;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: white;
      font-size: 48px;
      font-weight: 300;
    }
    .error-badge {
      display: inline-block;
      background-color: #f44336;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 8px;
    }
    .coming-soon {
      color: var(--text-muted);
      font-size: 11px;
      margin-left: 8px;
    }
    .status-card {
      background-color: var(--surface);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 12px;
    }
    .status-label {
      color: var(--text-secondary);
      font-weight: 500;
    }
    .status-value {
      color: var(--text-primary);
      font-weight: 600;
    }
    .action-button {
      width: 100%;
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 600;
      background-color: var(--surface);
      color: var(--text-primary);
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all 0.2s;
      margin-bottom: 8px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .action-button:hover {
      background-color: var(--surface-hover);
      border-color: var(--accent);
    }
    .action-button-disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .action-button-disabled:hover {
      background-color: var(--surface);
      border-color: var(--border);
    }
    .action-icon {
      font-size: 18px;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spinning {
      animation: spin 0.7s linear infinite;
    }
    .settings-icon {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 32px;
      height: 32px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 16px;
    }
    .settings-icon:hover {
      background-color: var(--surface-hover);
      border-color: var(--accent);
    }
    .collection-header {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: var(--collection-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 12px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .collection-header.drag-over {
      border-color: var(--accent);
      background: var(--accent-bg);
    }
    .collection-chevron {
      display: inline-block;
      font-size: 10px;
      color: var(--text-muted);
      margin-right: 6px;
      transition: transform 0.15s;
      width: 10px;
      text-align: center;
      flex-shrink: 0;
    }
    .collection-block.open .collection-chevron {
      transform: rotate(90deg);
    }
    .variable-row {
      display: flex;
      align-items: center;
      padding: 8px 12px 8px 24px;
      border: 1px solid transparent;
      border-radius: 6px;
      margin-bottom: 2px;
      font-size: 12px;
      cursor: grab;
      background: var(--surface);
      transition: all 0.15s;
      gap: 8px;
      color: var(--text-primary);
    }
    .variable-row:hover {
      background: var(--surface-subtle);
      border-color: var(--border);
    }
    .variable-row.dragging {
      opacity: 0.4;
    }
    .drag-handle {
      color: var(--drag-handle);
      font-size: 14px;
      cursor: grab;
      flex-shrink: 0;
    }
    .var-type-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      letter-spacing: 0.3px;
    }
    .var-type-COLOR { background: #fce7f3; color: #be185d; }
    .var-type-FLOAT { background: #dbeafe; color: #1d4ed8; }
    .var-type-BOOLEAN { background: #dcfce7; color: #15803d; }
    .var-type-STRING { background: #f3f4f6; color: #374151; }
    .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.1);
      flex-shrink: 0;
    }
    .screen-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .back-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-primary);
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s;
    }
    .back-icon:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }
    .screen-title {
      margin: 0 0 2px 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .screen-subtitle {
      margin: 0;
      font-size: 12px;
      color: var(--text-muted);
    }
    .input-field {
      width: 100%;
      padding: 12px;
      font-size: 13px;
      border: 1px solid var(--border-input);
      border-radius: 8px;
      margin-bottom: 12px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--surface);
      color: var(--text-primary);
    }
    .input-field:focus {
      outline: none;
      border-color: var(--accent);
    }
    .input-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
      display: block;
    }
    .create-tile {
      display: block;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
      transition: all 0.15s;
    }
    .create-tile:hover {
      border-color: var(--accent);
    }
    .create-tile-active {
      border-color: var(--accent);
      background: var(--accent-bg);
    }
    .create-swatch {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      cursor: pointer;
      transition: all 0.15s;
    }
    .create-swatch:hover {
      border-color: var(--accent);
    }
    .create-swatch-active {
      border-color: var(--accent);
      background: var(--accent-bg);
    }
    .create-swatch-dot {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.1);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="display: flex; flex-direction: column; height: 100vh; padding: 20px 20px 0 20px;">
      <div class="screen-header">
        <div class="back-icon" onclick="showDashboard()">←</div>
        <div>
          <p class="screen-title">Import JSON</p>
          <p class="screen-subtitle">Upload a token file to import</p>
        </div>
      </div>

      <div class="upload-container" id="dropzone" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0;">
        <div class="file-icon">📄</div>
        <div style="font-size: 15px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary);">Drop your JSON file here</div>
        <div style="font-size: 12px; color: var(--text-muted);">or click to browse</div>
        <input type="file" accept=".json" id="file-input" style="display: none;" />
      </div>

      <div style="background-color: var(--bg); padding: 16px 0 12px 0;">
        <button class="button-primary" onclick="document.getElementById('file-input').click()">Choose File</button>
        <button class="button-secondary" disabled style="opacity: 0.5; cursor: not-allowed;">Fetch from GitHub</button>
      </div>
    </div>
  </div>

  <script>
    console.log('Script starting...');

    let jsonTokens = null;
    let figmaVariables = [];
    let fileName = '';
    let currentVariableCount = 0;
    let githubConfig = null;

    const uploadScreenHTML = document.getElementById('root').innerHTML;

    const fileInput = document.getElementById('file-input');
    const dropzone = document.getElementById('dropzone');

    console.log('Elements found:', { fileInput, dropzone });

    function showDashboard() {
      parent.postMessage({ pluginMessage: { type: 'get-dashboard-data' } }, '*');
    }

    var _isRefreshing = false;

    function refreshDashboard() {
      const btn = document.getElementById('refresh-btn');
      if (btn) btn.classList.add('spinning');
      _isRefreshing = true;
      parent.postMessage({ pluginMessage: { type: 'get-dashboard-data' } }, '*');
    }

    function showRefreshSuccess() {
      const btn = document.getElementById('refresh-btn');
      if (!btn) return;
      btn.classList.remove('spinning');
      btn.textContent = '✓';
      btn.style.color = '#22c55e';
      btn.style.fontWeight = '700';
      setTimeout(function() {
        btn.textContent = '↻';
        btn.style.color = '';
        btn.style.fontWeight = '';
      }, 1500);
    }

    function renderDashboard(data) {
      currentVariableCount = data.variableCount || 0;

      document.getElementById('root').innerHTML = `
        <div style="display: flex; flex-direction: column; height: 100vh; padding: 20px 20px 12px 20px; position: relative;">
          <div style="position: absolute; top: 20px; right: 20px; display: flex; gap: 8px;">
            <div class="settings-icon" id="refresh-btn" onclick="refreshDashboard()" title="Refresh" style="position: static;">↻</div>
            <div class="settings-icon" onclick="showGitHubSettings()" title="GitHub Settings" style="position: static;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
              </svg>
            </div>
          </div>

          <div class="logo">b/</div>

          <h2 style="margin: 0 0 16px 0; font-size: 16px; font-weight: 600; color: var(--text-primary);">Token Manager</h2>

          <div class="status-card">
            <div style="font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">Current Status</div>
            <div class="status-row">
              <span class="status-label">Variables in Figma</span>
              <span class="status-value">${currentVariableCount}</span>
            </div>
            ${data.githubConnected ? `
              <div class="status-row" style="border-top: 1px solid #f0f0f0; margin-top: 8px; padding-top: 12px;">
                <span class="status-label">Connected Repo</span>
                <span class="status-value" style="font-size: 11px;">${data.githubRepo}</span>
              </div>
            ` : ''}
          </div>

          <div style="font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">Quick Actions</div>

          <button class="action-button" onclick="showUploadScreen()">
            <span class="action-icon">📥</span>
            <span>Import JSON File</span>
          </button>

          ${currentVariableCount > 0 ? `
            <button class="action-button" onclick="exportTokens()">
              <span class="action-icon">📤</span>
              <span>Export Tokens as JSON</span>
            </button>
          ` : ''}

          <button class="action-button ${!data.githubConnected ? 'action-button-disabled' : ''}" ${!data.githubConnected ? 'disabled' : 'onclick="showPushScreen()"'}>
            <span class="action-icon">🚀</span>
            <span>Push to GitHub</span>
            ${!data.githubConnected ? '<span style="font-size: 10px; color: #bbb; margin-left: auto;">Configure GitHub first</span>' : ''}
          </button>

          <button class="action-button" onclick="showCollectionManager()">
            <span class="action-icon">🗂️</span>
            <span>Tokens &amp; Variables</span>
            <span style="margin-left: auto; background: #f59e0b; color: white; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.5px;">BETA</span>
          </button>

          <button class="action-button" onclick="showCreateScreen()">
            <span class="action-icon">✨</span>
            <span>Create</span>
            <span style="margin-left: auto; background: #434343; color: #BBBBBB; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.5px;">NEW</span>
          </button>
        </div>
      `;
    }

    function showUploadScreen(backTarget) {
      jsonTokens = null;
      figmaVariables = [];
      fileName = '';

      const hasGitHubConfig = githubConfig && githubConfig.token && githubConfig.owner && githubConfig.repo && githubConfig.path;
      const backFn = backTarget === 'collections' ? 'showCollectionManager()' : 'showDashboard()';

      document.getElementById('root').innerHTML = `
        <div style="display: flex; flex-direction: column; height: 100vh; padding: 20px 20px 0 20px;">
          <div class="screen-header">
            <div class="back-icon" onclick="${backFn}">←</div>
            <div>
              <p class="screen-title">Import JSON</p>
              <p class="screen-subtitle">Upload a token file to import</p>
            </div>
          </div>

          <div class="upload-container" id="dropzone" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0;">
            <div class="file-icon">📄</div>
            <div style="font-size: 15px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary);">Drop your JSON file here</div>
            <div style="font-size: 12px; color: var(--text-muted);">or click to browse</div>
            <input type="file" accept=".json" id="file-input" style="display: none;" />
          </div>

          <div style="background-color: var(--bg); padding: 16px 0 12px 0;">
            <button class="button-primary" onclick="document.getElementById('file-input').click()">Choose File</button>
            <button class="button-secondary" ${!hasGitHubConfig ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : 'onclick="fetchFromGitHub()"'}>
              Fetch from GitHub
            </button>
          </div>
        </div>
      `;
      setupUploadListeners();
    }

    async function fetchFromGitHub() {
      if (!githubConfig || !githubConfig.token || !githubConfig.owner || !githubConfig.repo || !githubConfig.path) {
        alert('Please configure GitHub settings first');
        showGitHubSettings();
        return;
      }

      try {
        const url = `https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.path}?ref=${githubConfig.branch}`;

        const response = await fetch(url, {
          headers: {
            'Authorization': `token ${githubConfig.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!response.ok) {
          throw new Error(`GitHub API error: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        const content = atob(data.content.replace(/\n/g, ''));
        const raw = JSON.parse(content);

        jsonTokens = normalizeTokens(raw);
        fileName = githubConfig.path.split('/').pop();

        parent.postMessage({
          pluginMessage: {
            type: 'get-variables'
          }
        }, '*');
      } catch (error) {
        alert(`Failed to fetch from GitHub: ${error.message}`);
      }
    }

    function showPushScreen() {
      const today = new Date();
      const dateStr = today.getFullYear() + '-' +
        String(today.getMonth() + 1).padStart(2, '0') + '-' +
        String(today.getDate()).padStart(2, '0');
      const defaultBranch = 'figma-tokens/' + dateStr;

      document.getElementById('root').innerHTML = `
        <div style="display: flex; flex-direction: column; height: 100vh; padding: 20px 20px 0 20px;">
          <div class="screen-header">
            <div class="back-icon" onclick="showDashboard()">←</div>
            <div>
              <p class="screen-title">Push to GitHub</p>
              <p class="screen-subtitle">Export current Figma Variables and open a Pull Request</p>
            </div>
          </div>

          <div style="flex: 1; overflow-y: auto; min-height: 0;">
            <label class="input-label">Branch Name</label>
            <input type="text" class="input-field" id="push-branch" value="${defaultBranch}" />

            <label class="input-label">PR Title</label>
            <input type="text" class="input-field" id="push-pr-title" placeholder="Update design tokens from Figma" />

            <label class="input-label">PR Description <span style="color:#bbb; font-weight:400;">(optional)</span></label>
            <textarea class="input-field" id="push-pr-body" rows="3" placeholder="Describe what changed..." style="resize: none; height: 72px;"></textarea>

            <div style="background: var(--accent-bg); border-radius: 8px; padding: 12px; font-size: 11px; color: var(--text-secondary); line-height: 1.5; margin-top: 4px;">
              Will push to <strong>${githubConfig.owner}/${githubConfig.repo}</strong> and open a PR into <strong>${githubConfig.branch}</strong>

    function initiatePush() {
      const branch = document.getElementById('push-branch').value.trim();
      const prTitle = document.getElementById('push-pr-title').value.trim();
      const prBody = document.getElementById('push-pr-body').value.trim();

      if (!branch) { alert('Please enter a branch name.'); return; }
      if (!prTitle) { alert('Please enter a PR title.'); return; }

      const btn = document.getElementById('push-btn');
      btn.textContent = 'Pushing...';
      btn.disabled = true;

      // Store PR details globally, then request token JSON from backend
      window._pushData = { branch, prTitle, prBody };
      parent.postMessage({ pluginMessage: { type: 'get-tokens-for-push' } }, '*');
    }

    async function pushToGitHub(jsonString) {
      const { branch: newBranch, prTitle, prBody } = window._pushData;
      const { token, owner, repo, branch: baseBranch, path } = githubConfig;
      const headers = {
        'Authorization': 'token ' + token,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      };

      try {
        // Step 1: Get base branch SHA
        const refRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/ref/heads/${baseBranch}`, { headers });
        if (!refRes.ok) throw new Error('Could not get base branch: ' + refRes.statusText);
        const refData = await refRes.json();
        const commitSha = refData.object.sha;

        // Step 2: Create new branch
        const branchRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs`, {
          method: 'POST',
          headers,
          body: JSON.stringify({ ref: 'refs/heads/' + newBranch, sha: commitSha })
        });
        if (!branchRes.ok) {
          const err = await branchRes.json();
          throw new Error('Could not create branch: ' + (err.message || branchRes.statusText));
        }

        // Step 3: Get existing file SHA (if file already exists, needed to update it)
        let existingFileSha = null;
        const fileRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${newBranch}`, { headers });
        if (fileRes.ok) {
          const fileData = await fileRes.json();
          existingFileSha = fileData.sha;
        }

        // Step 4: Commit token file to new branch
        const contentBody = {
          message: 'chore: update design tokens from Figma',
          content: btoa(unescape(encodeURIComponent(jsonString))),
          branch: newBranch
        };
        if (existingFileSha) contentBody.sha = existingFileSha;

        const commitRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
          method: 'PUT',
          headers,
          body: JSON.stringify(contentBody)
        });
        if (!commitRes.ok) {
          const err = await commitRes.json();
          throw new Error('Could not commit file: ' + (err.message || commitRes.statusText));
        }

        // Step 5: Create Pull Request
        const prRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/pulls`, {
          method: 'POST',
          headers,
          body: JSON.stringify({ title: prTitle, body: prBody, head: newBranch, base: baseBranch })
        });
        if (!prRes.ok) {
          const err = await prRes.json();
          throw new Error('Could not create PR: ' + (err.message || prRes.statusText));
        }
        const prData = await prRes.json();

        showPushSuccess(prData.html_url, newBranch);
      } catch (error) {
        alert('Push failed: ' + error.message);
        // Re-enable button so user can retry
        const btn = document.getElementById('push-btn');
        if (btn) { btn.textContent = 'Create Pull Request'; btn.disabled = false; }
      }
    }

    // ── Minimal zip builder (stored / no compression) ──
    // Produces a valid .zip from { name, content: string } entries.
    var _crcTable = null;
    function _getCrcTable() {
      if (_crcTable) return _crcTable;
      _crcTable = new Uint32Array(256);
      for (var n = 0; n < 256; n++) {
        var c = n;
        for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        _crcTable[n] = c >>> 0;
      }
      return _crcTable;
    }
    function _crc32(bytes) {
      var table = _getCrcTable();
      var crc = 0xFFFFFFFF;
      for (var i = 0; i < bytes.length; i++) crc = table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }
    function createZip(files) {
      const encoder = new TextEncoder();
      const entries = files.map(function(f) {
        const nameBytes = encoder.encode(f.name);
        const data = encoder.encode(f.content);
        return { name: f.name, nameBytes: nameBytes, data: data, crc: _crc32(data) };
      });
      const chunks = [];
      let offset = 0;
      const centralRecords = [];
      for (const e of entries) {
        const headerBuf = new ArrayBuffer(30 + e.nameBytes.length);
        const v = new DataView(headerBuf);
        v.setUint32(0, 0x04034b50, true);
        v.setUint16(4, 20, true);
        v.setUint16(6, 0, true);
        v.setUint16(8, 0, true); // store
        v.setUint16(10, 0, true);
        v.setUint16(12, 0, true);
        v.setUint32(14, e.crc, true);
        v.setUint32(18, e.data.length, true);
        v.setUint32(22, e.data.length, true);
        v.setUint16(26, e.nameBytes.length, true);
        v.setUint16(28, 0, true);
        const header = new Uint8Array(headerBuf);
        header.set(e.nameBytes, 30);
        centralRecords.push({ entry: e, headerOffset: offset });
        chunks.push(header); offset += header.length;
        chunks.push(e.data); offset += e.data.length;
      }
      const centralStart = offset;
      for (const c of centralRecords) {
        const e = c.entry;
        const buf = new ArrayBuffer(46 + e.nameBytes.length);
        const v = new DataView(buf);
        v.setUint32(0, 0x02014b50, true);
        v.setUint16(4, 20, true);
        v.setUint16(6, 20, true);
        v.setUint16(8, 0, true);
        v.setUint16(10, 0, true);
        v.setUint16(12, 0, true);
        v.setUint16(14, 0, true);
        v.setUint32(16, e.crc, true);
        v.setUint32(20, e.data.length, true);
        v.setUint32(24, e.data.length, true);
        v.setUint16(28, e.nameBytes.length, true);
        v.setUint16(30, 0, true);
        v.setUint16(32, 0, true);
        v.setUint16(34, 0, true);
        v.setUint16(36, 0, true);
        v.setUint32(38, 0, true);
        v.setUint32(42, c.headerOffset, true);
        const arr = new Uint8Array(buf);
        arr.set(e.nameBytes, 46);
        chunks.push(arr); offset += arr.length;
      }
      const centralSize = offset - centralStart;
      const eocdBuf = new ArrayBuffer(22);
      const ev = new DataView(eocdBuf);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(4, 0, true);
      ev.setUint16(6, 0, true);
      ev.setUint16(8, entries.length, true);
      ev.setUint16(10, entries.length, true);
      ev.setUint32(12, centralSize, true);
      ev.setUint32(16, centralStart, true);
      ev.setUint16(20, 0, true);
      chunks.push(new Uint8Array(eocdBuf));
      const total = chunks.reduce(function(s, c) { return s + c.length; }, 0);
      const out = new Uint8Array(total);
      let p = 0;
      for (const c of chunks) { out.set(c, p); p += c.length; }
      return out;
    }

    // Holds buffered exports when we need to bundle into a zip.
    var _zipBuffer = null;

    function exportFromSelection() {
      const folderIds = getCheckedFolderIds();
      const hasTypography = folderIds.indexOf('__typography__') !== -1;
      const variableCollectionIds = folderIds.filter(function(id) { return id !== '__typography__'; });
      // Default (nothing selected) = export everything
      const exportTypography = hasTypography || folderIds.length === 0;
      const exportVariables = folderIds.length === 0 || variableCollectionIds.length > 0;

      if (exportVariables && exportTypography) {
        // Need both — collect into a zip and download once
        _zipBuffer = { variables: null, typography: null };
        const tokensPayload = { type: 'export-tokens' };
        if (variableCollectionIds.length > 0) tokensPayload.collectionIds = variableCollectionIds;
        parent.postMessage({ pluginMessage: tokensPayload }, '*');
        parent.postMessage({ pluginMessage: { type: 'export-text-styles' } }, '*');
        return;
      }

      if (exportTypography) {
        parent.postMessage({ pluginMessage: { type: 'export-text-styles' } }, '*');
        return;
      }

      // Variables only (or default = all)
      const payload = { type: 'export-tokens' };
      if (variableCollectionIds.length > 0) payload.collectionIds = variableCollectionIds;
      parent.postMessage({ pluginMessage: payload }, '*');
    }

    function moveSelected() {
      const targetCollectionId = document.getElementById('target-collection-select').value;
      if (!targetCollectionId) { alert('Please select a target collection.'); return; }
      const variableIds = getCheckedIds();
      if (!variableIds.length) return;

      // Optimistically move rows in the UI
      const targetContainer = document.querySelector('.variables-container[data-collection-id="' + targetCollectionId + '"]');
      variableIds.forEach(function(id) {
        const row = document.querySelector('.variable-row[data-variable-id="' + id + '"]');
        const cb = document.querySelector('.var-checkbox[data-variable-id="' + id + '"]');
        if (row && targetContainer && row.dataset.sourceCollection !== targetCollectionId) {
          row.dataset.sourceCollection = targetCollectionId;
          if (cb) { cb.dataset.sourceCollection = targetCollectionId; cb.checked = false; }
          targetContainer.appendChild(row);
        }
      });
      updateCounts();
      clearSelection();
      openCollection(targetCollectionId);

      parent.postMessage({ pluginMessage: { type: 'move-variables', variableIds, targetCollectionId } }, '*');

    function updateCounts() {
      document.querySelectorAll('.collection-block').forEach(function(block) {
        const count = block.querySelectorAll('.variable-row').length;
        const countEl = block.querySelector('.col-count');

    function renderCreateBody() {

      const styleOptions = _createData.styles.map(function(s) {

          <label class="create-tile ${checked ? 'create-tile-active' : ''}" onclick="selectStyle('${s.name}')">

        const checked = t.name === _selectedTheme;
        return `
          <label class="create-swatch ${checked ? 'create-swatch-active' : ''}" onclick="selectTheme('${t.name}')" title="${t.title}">
            <span class="create-swatch-dot" data-theme="${t.name}"></span>
            <span style="font-size: 11px; color: var(--text-primary);">${t.title}</span>
          </label>
        `;
      }

      body.innerHTML = `
        <div style="font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Style</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px;">
          ${styleOptions}
        </div>

        <div style="font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Theme · Base palettes</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px;">
          ${baseThemes.map(themeSwatch).join('')}
        </div>

        <div style="font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Theme · Accents</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px;">
          ${accentThemes.map(themeSwatch).join('')}
        </div>
      `;

      paintSwatches();
    }

    // Use a hidden div to convert oklch() (which the WebView supports) into rgb for the dot color
    function paintSwatches() {
      document.querySelectorAll('.create-swatch-dot').forEach(function(el) {
        const name = el.getAttribute('data-theme');
        const t = _createData.themes.find(function(x) { return x.name === name; });
        if (!t) return;
        // The themes list sent from backend is name+title only. We rely on a small swatch-color map.
        const color = _swatchColors[name] || '#999';
        el.style.background = color;
      });
    }

    // Static accent swatches — used purely for the picker preview.
    var _swatchColors = {
      neutral: '#525252', stone: '#78716c', zinc: '#71717a',
      mauve: '#7e7588', olive: '#6b7256', mist: '#6b7d8a', taupe: '#8a7868',
      amber: '#f59e0b', blue: '#3b82f6', cyan: '#06b6d4', emerald: '#10b981',
      fuchsia: '#d946ef', green: '#22c55e', indigo: '#6366f1', lime: '#84cc16',
      orange: '#f97316', pink: '#ec4899', purple: '#a855f7', red: '#ef4444',
      rose: '#f43f5e', sky: '#0ea5e9', teal: '#14b8a6', violet: '#8b5cf6',
      yellow: '#eab308',
      'bejamas-blue': '#1146ff', 'bejamas-neon-yellow': '#eaff00',
      'bejamas-apple': '#7ad96b', 'bejamas-orange': '#ff7849',
      'bejamas-sunflower': '#ffc83d', 'bejamas-violet': '#a259ff',
      'bejamas-turquoise': '#3dd6c4', 'bejamas-magenta': '#ff3dab'
    };

    function selectStyle(name) {
      _selectedStyle = name;
      renderCreateBody();
    }

    function selectTheme(name) {
      _selectedTheme = name;
      renderCreateBody();
    }

    function applyCreateSelection() {
      const btn = document.getElementById('create-apply-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Applying…'; }
      parent.postMessage({
        pluginMessage: { type: 'apply-theme', themeName: _selectedTheme, styleName: _selectedStyle }
      }, '*');
    }

    var _typographyTokens = null;

    function typographyBlockHtml() {
      return `
        <div class="collection-block" data-collection-id="__typography__" style="margin-bottom: 12px;">
          <div class="collection-header" data-collection-id="__typography__" onclick="toggleTypographyBlock(event)">
            <span class="collection-chevron">▸</span>
            <input type="checkbox" class="col-select-all" data-collection-id="__typography__"
              style="margin-right: 8px; cursor: pointer; width: 13px; height: 13px; accent-color: #1E90FF;"
              onclick="handleSelectAll(event, '__typography__')" />
            <span style="margin-right: 8px;">🔤</span>
            <span>Typography</span>
            <span class="col-count" id="typography-count" style="margin-left: auto; color: var(--text-muted); font-weight: 400;">text styles</span>
          </div>
          <div class="variables-container" data-collection-id="__typography__" style="display: none; padding: 12px 8px;">
            <pre id="typography-json" style="margin: 0; font-family: 'SF Mono', Monaco, 'Courier New', monospace; font-size: 11px; color: var(--text-primary); white-space: pre-wrap; word-break: break-word; line-height: 1.5; max-height: 320px; overflow: auto; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;">Open to load…</pre>
          </div>
        </div>
      `;
    }

    function toggleTypographyBlock(e) {
      toggleCollection(e, '__typography__');
      const block = document.querySelector('.collection-block[data-collection-id="__typography__"]');
      if (!block || !block.classList.contains('open')) return;
      if (_typographyTokens === null) {
        parent.postMessage({ pluginMessage: { type: 'get-text-styles' } }, '*');
      } else {
        renderTypography(_typographyTokens);
      }
    }

    function renderTypography(tokens) {
      _typographyTokens = tokens;
      const el = document.getElementById('typography-json');
      const countEl = document.getElementById('typography-count');
      if (!el) return;
      const count = tokens ? Object.keys(tokens).length : 0;
      if (countEl) countEl.textContent = count + ' style' + (count !== 1 ? 's' : '');
      if (count === 0) {
        el.textContent = 'No local text styles found in this file.';
      } else {
        el.textContent = JSON.stringify(tokens, null, 2);
      }
    }

    function showGitHubSettings() {
      document.getElementById('root').innerHTML = `
        <div style="display: flex; flex-direction: column; height: 100vh; padding: 20px 20px 12px 20px;">
          <div class="screen-header">
            <div class="back-icon" onclick="showDashboard()">←</div>
            <div>
              <p class="screen-title">GitHub Settings</p>
              <p class="screen-subtitle">Configure your GitHub connection</p>
            </div>
          </div>

          <div style="flex: 1; overflow-y: auto; min-height: 0;">
            <label class="input-label">Personal Access Token</label>
            <input type="password" class="input-field" id="github-token" placeholder="ghp_••••••••••••••••" />

            <label class="input-label">Repository Owner</label>
            <input type="text" class="input-field" id="github-owner" placeholder="your-organization" />

            <label class="input-label">Repository Name</label>
            <input type="text" class="input-field" id="github-repo" placeholder="design-tokens" />

            <label class="input-label">Branch</label>
            <input type="text" class="input-field" id="github-branch" value="main" />

            <label class="input-label">Token File Path</label>
            <input type="text" class="input-field" id="github-path" placeholder="tokens/colors.json" />

          </div>

          <div style="background-color: var(--bg); padding: 16px 0 0 0; margin-top: 16px;">
            <button class="button-primary" onclick="saveGitHubSettings()">Save Settings</button>
            <button class="button-secondary" onclick="showDashboard()">Cancel</button>
          </div>
        </div>
      `;

      if (githubConfig) {
        document.getElementById('github-token').value = githubConfig.token || '';
        document.getElementById('github-owner').value = githubConfig.owner || '';
        document.getElementById('github-repo').value = githubConfig.repo || '';
        document.getElementById('github-branch').value = githubConfig.branch || 'main';
        document.getElementById('github-path').value = githubConfig.path || '';
      }
    }

    function saveGitHubSettings() {
      githubConfig = {
        token: document.getElementById('github-token').value,
        owner: document.getElementById('github-owner').value,
        repo: document.getElementById('github-repo').value,
        branch: document.getElementById('github-branch').value,
        path: document.getElementById('github-path').value
      };

      parent.postMessage({
        pluginMessage: {
          type: 'save-github-config',
          config: githubConfig
        }
      }, '*');

      showDashboard();
    }

    function exportTokens() {
      parent.postMessage({ pluginMessage: { type: 'export-tokens' } }, '*');
    }

    function setupUploadListeners() {
      const newFileInput = document.getElementById('file-input');
      const newDropzone = document.getElementById('dropzone');

      if (!newFileInput || !newDropzone) return;

      newDropzone.addEventListener('dragover', handleDragOver);
      newDropzone.addEventListener('dragleave', handleDragLeave);
      newDropzone.addEventListener('drop', handleDrop);
      newFileInput.addEventListener('change', handleFileInput);
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.currentTarget.style.borderColor = '#18A0FB';
      e.currentTarget.style.backgroundColor = '#f0f8ff';
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.currentTarget.style.borderColor = '';
      e.currentTarget.style.backgroundColor = '#fafafa';
    }

    function handleDrop(e) {
      e.preventDefault();
      e.currentTarget.style.borderColor = '';
      e.currentTarget.style.backgroundColor = '#fafafa';

      const files = e.dataTransfer.files;
      if (files.length > 0) {
        processFile(files[0]);
      }
    }

    function handleFileInput(e) {
      const files = e.target.files;
      if (files.length > 0) {
        processFile(files[0]);
      }
    }

    setupUploadListeners();

    function processFile(file) {
      console.log('Processing file:', file.name);
      fileName = file.name;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const raw = JSON.parse(e.target.result);
          console.log('JSON parsed:', raw);
          jsonTokens = normalizeTokens(raw);
          console.log('Normalized tokens:', jsonTokens);
          parent.postMessage({ pluginMessage: { type: 'get-variables' } }, '*');
        } catch (error) {
          alert('Error parsing JSON file: ' + error);
        }
      };
      reader.readAsText(file);
    }

    // Detects and normalizes any known token format into the canonical flat structure:
    // { "group/token": { $value: ..., $type: ... } }
    function normalizeTokens(raw) {
      // Format 1: Array of collection objects: [{ "Collection Name": { modes: { "Mode": { tokens } } } }]
      if (Array.isArray(raw)) {
        var result = {};
        raw.forEach(function(collectionObj) {
          Object.keys(collectionObj).forEach(function(collectionName) {
            var collection = collectionObj[collectionName];
            if (collection && collection.modes && typeof collection.modes === 'object') {
              var modeNames = Object.keys(collection.modes);
              if (modeNames.length > 0) {
                Object.assign(result, extractTokens(collection.modes[modeNames[0]], ''));
              }
            } else {
              Object.assign(result, extractTokens(collection, ''));
            }
          });
        });
        return result;
      }

      // Format 2: Explicit "modes" key: { modes: { "Mode": { tokens } } }
      if (raw && raw.modes && typeof raw.modes === 'object') {
        var modeNames = Object.keys(raw.modes);
        if (modeNames.length > 0) {
          return extractTokens(raw.modes[modeNames[0]], '');
        }
      }

      // Format 3: Single wrapper key containing mode-like children
      // e.g. { "styles": { "light": { "background": "#fff" }, "dark": { ... } } }
      // Detects when there's one top-level key whose children are all objects (potential modes)
      var topKeys = Object.keys(raw);
      if (topKeys.length === 1) {
        var wrapper = raw[topKeys[0]];
        if (wrapper && typeof wrapper === 'object' && !('$value' in wrapper) && !('value' in wrapper)) {
          var childKeys = Object.keys(wrapper);
          var allChildrenAreGroups = childKeys.length > 0 && childKeys.every(function(k) {
            return wrapper[k] && typeof wrapper[k] === 'object' && !('$value' in wrapper[k]) && !('value' in wrapper[k]);
          });
          if (allChildrenAreGroups) {
            // Treat children as modes — use the first one
            return extractTokens(wrapper[childKeys[0]], '');
          }
        }
      }

      // Format 4: Top-level keys are all parallel mode-like objects sharing common token keys
      // e.g. { "light": { "background": "#fff", "primary": "#000" }, "dark": { "background": "#000", ... } }
      if (topKeys.length >= 2) {
        var allAreGroups = topKeys.every(function(k) {
          return raw[k] && typeof raw[k] === 'object' && !('$value' in raw[k]) && !('value' in raw[k]);
        });
        if (allAreGroups) {
          var firstModeKeys = Object.keys(raw[topKeys[0]]);
          var hasSharedKeys = topKeys.slice(1).some(function(k) {
            return Object.keys(raw[k]).some(function(ck) { return firstModeKeys.indexOf(ck) !== -1; });
          });
          if (hasSharedKeys) {
            // These look like parallel modes — use the first one
            return extractTokens(raw[topKeys[0]], '');
          }
        }
      }

      // Format 5: DTCG / Style Dictionary nested structure (default)
      return extractTokens(raw, '');
    }

    // Recursively extracts tokens from a nested object into flat { "path/to/token": { $value, $type } }
    function extractTokens(obj, prefix) {
      var result = {};
      if (!obj || typeof obj !== 'object') return result;

      Object.keys(obj).forEach(function(key) {
        // Skip metadata keys
        if (key === '$scopes' || key === '$description' || key === '$extensions') return;

        var val = obj[key];
        var fullName = prefix ? prefix + '/' + key : key;

        if (val !== null && val !== undefined && typeof val !== 'object') {
          // Primitive value (string, number, boolean) — treat as a token directly
          result[fullName] = {
            $value: val,
            $type: guessType(val)
          };
        } else if (val && typeof val === 'object') {
          var hasValue = '$value' in val || 'value' in val;

          if (hasValue) {
            // It's a token — normalize to canonical form
            result[fullName] = {
              $value: val.$value !== undefined ? val.$value : val.value,
              $type: val.$type || val.type || guessType(val.$value !== undefined ? val.$value : val.value)
            };
          } else {
            // It's a group — recurse
            Object.assign(result, extractTokens(val, fullName));
          }
        }
      });

      return result;
    }

    // Guesses token type from value if $type is missing
    function guessType(value) {
      if (typeof value === 'boolean') return 'boolean';
      if (typeof value === 'number') return 'float';
      if (typeof value === 'string') {
        if (/^#([0-9a-fA-F]{3,8})$/.test(value)) return 'color';
        if (/^rgba?\(/.test(value)) return 'color';
        if (/^\d+(\.\d+)?(px|rem|em|%)$/.test(value)) return 'dimension';
        if (/^\d+(\.\d+)?$/.test(value)) return 'float';
      }
      return 'string';
    }

    function flattenTokens(obj, prefix) {
      prefix = prefix || '';
      var normalized = normalizeTokens(obj);
      var result = {};

      for (var key in normalized) {
        var value = normalized[key];
        result[key] = {
          value: value.$value,
          type: value.$type || 'string'
        };
      }

      return result;
    }

    function formatValue(value, type) {
      if (type === 'color' && typeof value === 'object' && value.r !== undefined) {
        const r = Math.round(value.r * 255);
        const g = Math.round(value.g * 255);
        const b = Math.round(value.b * 255);
        const hex = '#' + [r, g, b].map(function(x) {
          return x.toString(16).padStart(2, '0');
        }).join('');
        return hex;
      }
      return String(value);
    }

    function showComparison(variables) {
      figmaVariables = variables;
      const flatTokens = flattenTokens(jsonTokens);
      const toUpdate = [];
      const toCreate = [];

      for (const tokenName in flatTokens) {
        const token = flatTokens[tokenName];
        const matchingVar = variables.find(function(v) { return v.name === tokenName; });

        if (matchingVar) {
          toUpdate.push({
            name: tokenName,
            figmaValue: matchingVar.value,
            jsonValue: token.value,
            type: token.type || 'string',
            action: 'update'
          });
        } else {
          toCreate.push({
            name: tokenName,
            jsonValue: token.value,
            type: token.type || 'string',
            action: 'create'
          });
        }
      }

      const totalCount = toUpdate.length + toCreate.length;

      if (totalCount === 0) {
        document.getElementById('root').innerHTML = `
          <div class="logo">b/</div>
          <h2 style="margin: 0 0 8px 0; font-size: 16px; font-weight: 600; color: var(--text-primary);">No Tokens Found</h2>
          <div style="padding: 20px; text-align: center; background-color: var(--surface); border-radius: 8px; font-size: 12px; color: var(--text-secondary); border: 1px solid var(--border);">
            No tokens found in the JSON file
          </div>
          <button class="button-secondary" onclick="resetToUpload()">Go Back</button>
        `;
        return;
      }

      let allTokensHTML = '';
      const allTokens = toCreate.concat(toUpdate);

      allTokensHTML = allTokens.map(function(token) {
        const isUpdate = token.action === 'update';
        return `
          <div class="token-card">
            <div class="token-name">${token.name}</div>
            <div class="token-details">
              <div class="token-pill">
                <span class="token-label">Value:</span>
                <span>${formatValue(isUpdate ? token.jsonValue : token.jsonValue, token.type)}</span>
              </div>
              <div class="token-pill">
                <span class="token-label">Type:</span>
                <span>${token.type}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('root').innerHTML = `
        <div style="display: flex; flex-direction: column; height: 100vh; padding: 20px 20px 0 20px;">
          <div>
            <div class="logo">b/</div>

            <h2 style="margin: 0 0 4px 0; font-size: 16px; font-weight: 600; color: var(--text-primary);">Token Review</h2>
            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">File: ${fileName}</div>

            <div class="stats-line">
              ${toCreate.length > 0 ? toCreate.length + '/' + totalCount + ' created' : totalCount + ' token' + (totalCount !== 1 ? 's' : '')}
            </div>

            <div style="font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">
              ${toCreate.length > 0 ? 'New Tokens' : 'Tokens to Update'}
            </div>
          </div>

          <div style="flex: 1; overflow-y: auto; min-height: 0; margin-bottom: 16px;">
            ${allTokensHTML}
          </div>

          <div style="background-color: var(--bg); padding: 16px 0 12px 0;">
            <button class="button-primary" onclick="handleReplace()">Apply</button>
            <button class="button-secondary" onclick="resetToUpload()">Go Back</button>
          </div>
        </div>
      `;
    }

    function handleReplace() {
      parent.postMessage({
        pluginMessage: {
          type: 'replace-tokens',
          tokens: jsonTokens
        }
      }, '*');
    }

    function showSuccess(results) {
      const updated = results.updated || 0;
      const created = results.created || 0;
      const skipped = results.skipped || 0;
      const total = updated + created;

      let detailsHTML = '';
      if (updated > 0 || created > 0) {
        detailsHTML = `
          <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.6;">
            <div style="margin-bottom: 4px;"><strong style="color: var(--text-primary);">${total}</strong> variable${total !== 1 ? 's' : ''} ${updated > 0 ? 'updated' : 'created'}</div>
            ${skipped > 0 ? '<div class="error-badge">' + skipped + ' skipped (errors)</div>' : ''}
          </div>
        `;
      }

      document.getElementById('root').innerHTML = `
        <div style="text-align: center; padding-top: 80px;">
          <div class="logo" style="margin: 0 auto 32px;">b/</div>
          <div class="success-icon">✓</div>
          <h2 style="margin: 0 0 16px 0; font-size: 18px; font-weight: 600; color: var(--text-primary);">Import Complete</h2>
          ${detailsHTML}
          <button class="button-primary" onclick="showDashboard()">Back to Dashboard</button>
        </div>
      `;
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      console.log('Message from plugin:', msg);

      if (msg.type === 'dashboard-data') {
        const wasRefreshing = _isRefreshing;
        _isRefreshing = false;
        renderDashboard(msg.data);
        if (wasRefreshing) showRefreshSuccess();
      } else if (msg.type === 'figma-variables') {
        showComparison(msg.variables);
      } else if (msg.type === 'replace-complete') {
        showSuccess(msg.results);
      } else if (msg.type === 'github-config-loaded') {
        githubConfig = msg.config;
      } else if (msg.type === 'github-fetch-success') {
        jsonTokens = msg.tokens;
        fileName = msg.filename;
        parent.postMessage({ pluginMessage: { type: 'get-variables' } }, '*');
      } else if (msg.type === 'collections-data') {
        renderCollections(msg.collections);
      } else if (msg.type === 'variables-moved') {
        // No-op: UI was already updated optimistically
      } else if (msg.type === 'tokens-ready-for-push') {
        pushToGitHub(msg.json);
      } else if (msg.type === 'create-data') {
        _createData = { styles: msg.styles, themes: msg.themes };
        renderCreateBody();
      } else if (msg.type === 'apply-theme-complete') {
        const btn = document.getElementById('create-apply-btn');
        if (btn) { btn.disabled = false; btn.textContent = 'Apply theme'; }
        const lines = ['Updated ' + msg.updated + ' variable' + (msg.updated !== 1 ? 's' : '') + '.'];
        if (msg.unmatched && msg.unmatched.length) {
          lines.push('');
          lines.push('No matching variable found for: ' + msg.unmatched.slice(0, 8).join(', ') +
            (msg.unmatched.length > 8 ? ' (+' + (msg.unmatched.length - 8) + ' more)' : ''));
        }
        alert(lines.join('\n'));
      } else if (msg.type === 'text-styles-data') {
        renderTypography(msg.tokens);
      } else if (msg.type === 'typography-import-complete') {
        const r = msg.results || {};
        const parts = [];
        if (r.created) parts.push(r.created + ' created');
        if (r.updated) parts.push(r.updated + ' updated');
        if (r.skipped) parts.push(r.skipped + ' skipped');
        alert('Import complete: ' + (parts.join(', ') || 'nothing changed') +
          (r.errors && r.errors.length ? '\n\nErrors:\n' + r.errors.slice(0, 5).join('\n') : ''));
        parent.postMessage({ pluginMessage: { type: 'get-text-styles' } }, '*');
      } else if (msg.type === 'download-json') {
        // If we're collecting both files into a zip, buffer instead of downloading
        if (_zipBuffer) {
          if (msg.filename === 'figma-typography.json') _zipBuffer.typography = msg.json;
          else _zipBuffer.variables = msg.json;

          if (_zipBuffer.variables !== null && _zipBuffer.typography !== null) {
            const zipBytes = createZip([
              { name: 'variables.json', content: _zipBuffer.variables },
              { name: 'typography.json', content: _zipBuffer.typography }
            ]);
            const zipBlob = new Blob([zipBytes], { type: 'application/zip' });
            const zipUrl = URL.createObjectURL(zipBlob);
            const za = document.createElement('a');
            za.href = zipUrl;
            za.download = 'figma-tokens.zip';
            za.click();
            URL.revokeObjectURL(zipUrl);
            _zipBuffer = null;
          }
          return;
        }
        const blob = new Blob([msg.json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = msg.filename;
        a.click();
        URL.revokeObjectURL(url);
      } else if (msg.type === 'error') {
        // Cancel any pending zip collection on backend error so we don't hang
        _zipBuffer = null;
        alert('Error: ' + msg.error);
      }
    };

    console.log('UI initialized');

    showDashboard();
  </script>
</body>
</html>
