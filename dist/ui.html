      mcpAnimateDots();
      _mcp.retryTimer = setTimeout(function() { mcpAttemptConnect(port); }, 2000);

    function mcpAnimateDots() {
      var i = 0;
      var frames = ['·  ', '·· ', '···'];
      var interval = setInterval(function() {
        var el = document.getElementById('mcp-retry-dots');
        if (!el) { clearInterval(interval); return; }
        el.textContent = frames[i % frames.length];
        i++;
      }, 500);

    function mcpCopyCmd() {
      var el = document.getElementById('mcp-cmd-text');
      var btn = document.getElementById('mcp-cmd-copy-btn');
      var txt = el ? el.textContent : '';
      var done = function() {
        if (btn) { btn.textContent = '✓ Copied!'; btn.style.borderColor = '#4caf50'; btn.style.color = '#4caf50'; }
        setTimeout(function() { if (btn) { btn.textContent = 'Copy'; btn.style.borderColor = ''; btn.style.color = ''; } }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done).catch(function() { mcpCopyFallback(txt); done(); });
      } else { mcpCopyFallback(txt); done(); }
    }

    function mcpClearRetry() {
      if (_mcp.retryTimer) { clearTimeout(_mcp.retryTimer); _mcp.retryTimer = null; }
    }

    function mcpDisconnect() {

      } else {
        mcpCopyFallback(txt); copy();

    function mcpCopyFallback(txt) {
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
      document.body.appendChild(ta);

          <span id="mini-ch" style="font-size:11px;font-family:monospace;color:var(--text-muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${_mcp.channel || ''}</span>
          ${_mcp.connected && _mcp.channel ? `<button onclick="mcpCopyChannel('${_mcp.channel}')" style="background:none;border:1px solid var(--border);border-radius:4px;cursor:pointer;padding:2px 8px;font-size:10px;color:var(--text-secondary);transition:all 0.15s;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-secondary)'">Copy</button>` : ''}
          <button onclick="mcpExpand()" title="Expand" style="background:none;border:1px solid var(--border);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text-secondary);flex-shrink:0;transition:border-color 0.15s;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">+</button>
        </div>
      `;
      parent.postMessage({ pluginMessage: { type: 'resize-plugin', width: 460, height: 48 } }, '*');
    }

    function mcpExpand() {
      parent.postMessage({ pluginMessage: { type: 'resize-plugin', width: 460, height: 700 } }, '*');
      showClaudeScreen();
    }

    function mcpHandleSocketMessage(payload) {
      var data = payload.message;
      if (!data) return;

      // Response to a pending request
      if (data.id && _mcp.pendingRequests.has(data.id)) {
        var cb = _mcp.pendingRequests.get(data.id);
        _mcp.pendingRequests.delete(data.id);
        if (data.error) cb.reject(new Error(data.error));
        else cb.resolve(data.result);
        return;
      }

      // New command from Claude
      if (data.command) {
        parent.postMessage({ pluginMessage: { type: 'execute-command', id: data.id, command: data.command, params: data.params } }, '*');
      }
    }

    function mcpHandleCommandResult(msg) {
      if (!_mcp.connected || !_mcp.socket) return;
      _mcp.socket.send(JSON.stringify({ id: msg.id, type: 'message', channel: _mcp.channel, message: { id: msg.id, result: msg.result } }));
    }

    function mcpHandleCommandError(msg) {
      if (!_mcp.connected || !_mcp.socket) return;
      _mcp.socket.send(JSON.stringify({ id: msg.id, type: 'message', channel: _mcp.channel, message: { id: msg.id, error: msg.error } }));
    }

    function mcpHandleProgress(msg) {
      var wrap = document.getElementById('mcp-progress-wrap');
      var bar = document.getElementById('mcp-progress-bar');
      var pmsg = document.getElementById('mcp-progress-msg');
      var ppct = document.getElementById('mcp-progress-pct');
      if (wrap) wrap.style.display = '';
      if (bar) bar.style.width = (msg.progress || 0) + '%';
      if (pmsg) pmsg.textContent = msg.message || 'In progress';
      if (ppct) ppct.textContent = (msg.progress || 0) + '%';
      if (msg.status === 'completed') { setTimeout(function() { if (wrap) wrap.style.display = 'none'; }, 4000); }

      // Forward progress to server
      if (_mcp.connected && _mcp.socket) {
        _mcp.socket.send(JSON.stringify({ id: msg.commandId, type: 'progress_update', channel: _mcp.channel, message: { id: msg.commandId, type: 'progress_update', data: msg } }));
      }
    }
    // ── End Claude AI / MCP bridge ────────────────────────────────────────────

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      console.log('Message from plugin:', msg);

      if (msg.type === 'dashboard-data') {
        const wasRefreshing = _isRefreshing;
        _isRefreshing = false;
        renderDashboard(msg.data);
        if (wasRefreshing) {
          const btn = document.getElementById('refresh-icon');
          if (btn) btn.classList.add('spinning');
          setTimeout(showRefreshSuccess, 300);
        }
      } else if (msg.type === 'figma-variables') {
        showComparison(msg.variables);
      } else if (msg.type === 'replace-complete') {
        showSuccess(msg.results);
      } else if (msg.type === 'github-config-loaded') {
        githubConfig = msg.config;
      } else if (msg.type === 'github-fetch-success') {
        jsonTokens = msg.tokens;
        fileName = msg.filename;
        parent.postMessage({ pluginMessage: { type: 'get-variables' } }, '*');
      } else if (msg.type === 'collections-data') {
        renderCollections(msg.collections);
      } else if (msg.type === 'variables-moved') {
        // No-op: UI was already updated optimistically
      } else if (msg.type === 'tokens-ready-for-push') {
        pushToGitHub(msg.json);
      } else if (msg.type === 'create-data') {
        _createData = { styles: msg.styles, themes: msg.themes };
        renderCreateBody();
      } else if (msg.type === 'apply-theme-complete') {
        const btn = document.getElementById('create-apply-btn');
        if (btn) { btn.disabled = false; btn.textContent = 'Apply theme'; }
        const parts = ['Updated ' + msg.updated + ' color variable' + (msg.updated !== 1 ? 's' : '')];
        if (msg.radiusUpdated) parts.push(msg.radiusUpdated + ' radius variable' + (msg.radiusUpdated !== 1 ? 's' : ''));
        const lines = [parts.join(' and ') + '.'];

        if (msg.radiusUpdated && msg.radiusSamples && msg.radiusSamples.length) {
          lines.push('');
          lines.push('Radius writes: ' + msg.radiusSamples.join(', '));
        }
        // Diagnostic: nothing got updated even though radius application was attempted
        if (msg.radiusFloatCount !== undefined && msg.radiusUpdated === 0 && msg.radiusFloatCount > 0) {
          lines.push('');
          lines.push('Radius diagnostic:');
          lines.push('  FLOAT variables scanned: ' + msg.radiusFloatCount);
          lines.push('  Names containing "radius"/"rounded": ' + msg.radiusNameMatched);
          if (msg.radiusFailed) lines.push('  setValueForMode failed on: ' + msg.radiusFailed);
          if (msg.floatSamples && msg.floatSamples.length) {
            lines.push('  Sample FLOAT names: ' + msg.floatSamples.slice(0, 5).join(', '));
          }
          if (msg.radiusFailures && msg.radiusFailures.length) {
            lines.push('  First failure: ' + msg.radiusFailures[0]);
          }
        }
        if (msg.unmatched && msg.unmatched.length) {
          lines.push('');
          lines.push('No matching variable found for: ' + msg.unmatched.slice(0, 8).join(', ') +
            (msg.unmatched.length > 8 ? ' (+' + (msg.unmatched.length - 8) + ' more)' : ''));
        }
        alert(lines.join('\n'));
      } else if (msg.type === 'page-audit-result') {
        renderAuditResults(msg);
      } else if (msg.type === 'unused-variables-result') {
        renderUnusedVars(msg);
      } else if (msg.type === 'component-tokens-result') {
        renderComponentTokens(msg);
      } else if (msg.type === 'component-map-result') {
        renderComponentMap(msg);
      } else if (msg.type === 'selection-check-result') {
        renderInspectResults(msg);
      } else if (msg.type === 'text-styles-data') {
        renderTypography(msg.tokens);
      } else if (msg.type === 'typography-import-complete') {
        const r = msg.results || {};
        const parts = [];
        if (r.created) parts.push(r.created + ' created');
        if (r.updated) parts.push(r.updated + ' updated');
        if (r.skipped) parts.push(r.skipped + ' skipped');
        alert('Import complete: ' + (parts.join(', ') || 'nothing changed') +
          (r.errors && r.errors.length ? '\n\nErrors:\n' + r.errors.slice(0, 5).join('\n') : ''));
        parent.postMessage({ pluginMessage: { type: 'get-text-styles' } }, '*');
      } else if (msg.type === 'download-json') {
        // If we're collecting both files into a zip, buffer instead of downloading
        if (_zipBuffer) {
          if (msg.filename === 'figma-typography.json') _zipBuffer.typography = msg.json;
          else _zipBuffer.variables = msg.json;

          if (_zipBuffer.variables !== null && _zipBuffer.typography !== null) {
            const zipBytes = createZip([
              { name: 'variables.json', content: _zipBuffer.variables },
              { name: 'typography.json', content: _zipBuffer.typography }
            ]);
            const zipBlob = new Blob([zipBytes], { type: 'application/zip' });
            const zipUrl = URL.createObjectURL(zipBlob);
            const za = document.createElement('a');
            za.href = zipUrl;
            za.download = 'figma-tokens.zip';
            za.click();
            URL.revokeObjectURL(zipUrl);
            _zipBuffer = null;
          }
          return;
        }
        const blob = new Blob([msg.json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = msg.filename;
        a.click();
        URL.revokeObjectURL(url);
      } else if (msg.type === 'duplicate-tokens-result') {
        renderDuplicates(msg);
      } else if (msg.type === 'all-variables-for-diff') {
        renderTokenDiff(msg.variables);
      } else if (msg.type === 'command-result') {
        mcpHandleCommandResult(msg);
      } else if (msg.type === 'command-error') {
        mcpHandleCommandError(msg);
      } else if (msg.type === 'command_progress') {
        mcpHandleProgress(msg);
      } else if (msg.type === 'error') {
        // Cancel any pending zip collection on backend error so we don't hang
        _zipBuffer = null;
        alert('Error: ' + msg.error);
      }
    };

    // Ensure the plugin iframe captures keyboard focus on every click.
    // Figma intercepts keyboard events from the canvas; calling window.focus() + re-focusing
    // the target element is the reliable fix for inputs appearing non-typeable.
    document.addEventListener('mousedown', function(e) {
      window.focus();
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) {
        setTimeout(function() { t.focus(); }, 0);
      }
    }, true);

    console.log('UI initialized');

    showDashboard();
  </script>
</body>
</html>
