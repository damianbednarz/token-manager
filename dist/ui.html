<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Figma Token Replacer</title>
  <style>
    /* ── Light theme tokens (default) ── */
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --surface-hover: #f8f8f8;
      --surface-subtle: #f8f9fa;
      --border: #e8e8e8;
      --border-input: #e0e0e0;
      --text-primary: #0F1C2E;
      --text-secondary: #666;
      --text-muted: #999;
      --text-body: #333;
      --accent: #1E90FF;
      --accent-bg: #eef6ff;
      --pill-bg: #f5f5f5;
      --collection-bg: #f8f9fa;
      --drag-handle: #ccc;
    }

    /* ── Dark theme tokens ── */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --surface: #2c2c2c;
        --surface-hover: #363636;
        --surface-subtle: #333333;
        --border: #3d3d3d;
        --border-input: #444444;
        --text-primary: #f0f0f0;
        --text-secondary: #aaaaaa;
        --text-muted: #777777;
        --text-body: #cccccc;
        --accent: #4da6ff;
        --accent-bg: #1a2d40;
        --pill-bg: #383838;
        --collection-bg: #333333;
        --drag-handle: #555;
      }
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      background-color: var(--bg);
      color: var(--text-primary);
    }
    * {
      box-sizing: border-box;
    }
    #root {
      width: 100%;
      height: 100vh;
      padding: 0;
      overflow: hidden;
    }
    .logo {
      width: 32px;
      height: 32px;
      background-color: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 24px;
    }
    .upload-container {
      border: 2px dashed var(--border-input);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      background-color: var(--surface);
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-container:hover {
      border-color: var(--accent);
      background-color: var(--accent-bg);
    }
    .file-icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.6;
    }
    .button-primary {
      width: 100%;
      padding: 14px 24px;
      font-size: 13px;
      font-weight: 600;
      background-color: var(--text-primary);
      color: var(--bg);
      border-radius: 8px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      margin-top: 20px;
    }
    .button-primary:hover {
      opacity: 0.85;
    }
    .button-secondary {
      width: 100%;
      padding: 14px 24px;
      font-size: 13px;
      font-weight: 600;
      background-color: var(--surface);
      color: var(--text-body);
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border-input);
      transition: all 0.2s;
      margin-top: 12px;
    }
    .button-secondary:hover {
      background-color: var(--surface-hover);
    }
    .token-card {
      background-color: var(--surface);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .token-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 12px;
      word-break: break-word;
    }
    .token-details {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .token-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background-color: var(--pill-bg);
      border-radius: 6px;
      font-size: 11px;
      font-family: 'SF Mono', Monaco, 'Courier New', monospace;
      color: var(--text-primary);
    }
    .token-label {
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 600;
    }
    .section-header {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stats-line {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      color: var(--text-body);
    }
    .success-icon {
      width: 80px;
      height: 80px;
      background-color: #4CAF50;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: white;
      font-size: 48px;
      font-weight: 300;
    }
    .error-badge {
      display: inline-block;
      background-color: #f44336;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 8px;
    }
    .coming-soon {
      color: var(--text-muted);
      font-size: 11px;
      margin-left: 8px;
    }
    .status-card {
      background-color: var(--surface);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 12px;
    }
    .status-label {
      color: var(--text-secondary);
      font-weight: 500;
    }
    .status-value {
      color: var(--text-primary);
      font-weight: 600;
    }
    .action-button {
      width: 100%;
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 600;
      background-color: var(--surface);
      color: var(--text-primary);
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all 0.2s;
      margin-bottom: 8px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .action-button:hover {
      background-color: var(--surface-hover);
      border-color: var(--accent);
    }
    .action-button-disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .action-button-disabled:hover {
      background-color: var(--surface);
      border-color: var(--border);
    }
    .action-icon {
      font-size: 18px;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spinning {
      animation: spin 0.4s linear infinite;
    }
    .settings-icon {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 32px;
      height: 32px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 16px;
    }
    .settings-icon:hover {
      background-color: var(--surface-hover);
      border-color: var(--accent);
    }
    .collection-header {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: var(--collection-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 12px;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .collection-header.drag-over {
      border-color: var(--accent);
      background: var(--accent-bg);
    }
    .collection-chevron {
      display: inline-block;
      font-size: 10px;
      color: var(--text-muted);
      margin-right: 6px;
      transition: transform 0.15s;
      width: 10px;
      text-align: center;
      flex-shrink: 0;
    }
    .collection-block.open .collection-chevron {
      transform: rotate(90deg);
    }
    .variable-row {
      display: flex;
      align-items: center;
      padding: 8px 12px 8px 24px;
      border: 1px solid transparent;
      border-radius: 6px;
      margin-bottom: 2px;
      font-size: 12px;
      cursor: grab;
      background: var(--surface);
      transition: all 0.15s;
      gap: 8px;
      color: var(--text-primary);
    }
    .variable-row:hover {
      background: var(--surface-subtle);
      border-color: var(--border);
    }
    .variable-row.dragging {
      opacity: 0.4;
    }
    .drag-handle {
      color: var(--drag-handle);
      font-size: 14px;
      cursor: grab;
      flex-shrink: 0;
    }
    .var-type-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      letter-spacing: 0.3px;
    }
    .var-type-COLOR { background: #fce7f3; color: #be185d; }
    .var-type-FLOAT { background: #dbeafe; color: #1d4ed8; }
    .var-type-BOOLEAN { background: #dcfce7; color: #15803d; }
    .var-type-STRING { background: #f3f4f6; color: #374151; }
    .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.1);
      flex-shrink: 0;
    }
    .screen-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }
    .back-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-primary);
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s;
    }
    .back-icon:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }
    .screen-title {
      margin: 0 0 2px 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .screen-subtitle {
      margin: 0;
      font-size: 12px;
      color: var(--text-muted);
    }
    .input-field {
      width: 100%;
      padding: 12px;
      font-size: 13px;
      border: 1px solid var(--border-input);
      border-radius: 8px;
      margin-bottom: 12px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--surface);
      color: var(--text-primary);
    }
    .input-field:focus {
      outline: none;
      border-color: var(--accent);
    }
    .input-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
      display: block;
    }
    .create-tile {
      display: block;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
      transition: all 0.15s;
    }
    .create-tile:hover {
      border-color: var(--accent);
    }
    .create-tile-active {
      border-color: var(--accent);
      background: var(--accent-bg);
    }
    .create-swatch {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      cursor: pointer;
      transition: all 0.15s;
    }
    .create-swatch:hover {
      border-color: var(--accent);
    }
    .create-swatch-active {
      border-color: var(--accent);
      background: var(--accent-bg);
    }
    .create-swatch-dot {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.1);
      flex-shrink: 0;
    }
    .inspect-node-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .inspect-node-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
      background: var(--surface-subtle);
    }
    .inspect-node-path {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }
    .inspect-issue-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font-size: 11px;
      border-bottom: 1px solid var(--border);
    }
    .inspect-issue-row:last-child { border-bottom: none; }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.hardcoded { background: #ef4444; }
    .status-dot.mismatch  { background: #f59e0b; }
    .status-dot.ok        { background: #22c55e; }
    .color-chip {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
    .inspect-summary {
      display: flex;
      gap: 12px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 11px;
    }
    .summary-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }
    .inspect-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      gap: 8px;
    }
    .inspect-fix-btn {
      margin-left: auto;
      flex-shrink: 0;
      padding: 3px 10px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid var(--border-input);
      background: var(--surface);
      color: var(--accent);
      transition: all 0.15s;
    }
    .inspect-fix-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
    .inspect-fix-all-btn {
      margin-left: auto;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      transition: opacity 0.15s;
    }
    .inspect-fix-all-btn:hover { opacity: 0.85; }
    details > summary { list-style: none; cursor: pointer; user-select: none; }
    details > summary::-webkit-details-marker { display: none; }
    .inspect-accordion-summary {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }
    .inspect-accordion-summary .chevron {
      font-size: 9px;
      display: inline-block;
      transition: transform 0.15s;
    }
    details[open] > summary .chevron { transform: rotate(90deg); }
    @keyframes mcp-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.55); }
      70%  { box-shadow: 0 0 0 5px rgba(76, 175, 80, 0); }
      100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
    }
    .mcp-dot-live {
      animation: mcp-pulse 1.8s ease-out infinite;
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="display: flex; flex-direction: column; height: 100vh; padding: 20px 20px 0 20px;">
      <div class="screen-header">
        <div class="back-icon" onclick="showDashboard()">←</div>
        <div>
          <p class="screen-title">Import JSON</p>
          <p class="screen-subtitle">Upload a token file to import</p>
        </div>
      </div>

      <div class="upload-container" id="dropzone" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0;">
        <div class="file-icon">📄</div>
        <div style="font-size: 15px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary);">Drop your JSON file here</div>
        <div style="font-size: 12px; color: var(--text-muted);">or click to browse</div>
        <input type="file" accept=".json" id="file-input" style="display: none;" />
      </div>

      <div style="background-color: var(--bg); padding: 16px 0 12px 0;">
        <button class="button-primary" onclick="document.getElementById('file-input').click()">Choose File</button>
        <button class="button-secondary" disabled style="opacity: 0.5; cursor: not-allowed;">Fetch from GitHub</button>
      </div>
    </div>
  </div>

  <script>
    console.log('Script starting...');

    let jsonTokens = null;
    let figmaVariables = [];
    let fileName = '';
    let currentVariableCount = 0;
    let githubConfig = null;
    var _dashboardData = null;
    var _activeTab = 'designer';

    const uploadScreenHTML = document.getElementById('root').innerHTML;

    const fileInput = document.getElementById('file-input');
    const dropzone = document.getElementById('dropzone');

    console.log('Elements found:', { fileInput, dropzone });

    function showDashboard() {
      parent.postMessage({ pluginMessage: { type: 'get-dashboard-data' } }, '*');
    }

    var _isRefreshing = false;

    function refreshDashboard() {
      const icon = document.getElementById('refresh-icon');
      if (icon) icon.classList.add('spinning');
      _isRefreshing = true;
      parent.postMessage({ pluginMessage: { type: 'get-dashboard-data' } }, '*');
    }

    function showRefreshSuccess() {
      const icon = document.getElementById('refresh-icon');
      if (!icon) return;
      icon.classList.remove('spinning');
      icon.textContent = '✓';
      icon.style.color = '#22c55e';
      icon.style.fontWeight = '700';
      setTimeout(function() {
        icon.textContent = '↻';
        icon.style.color = '';
        icon.style.fontWeight = '';
      }, 800);
    }

    function renderDashboard(data) {
      _dashboardData = data;
      currentVariableCount = data.variableCount || 0;

      document.getElementById('root').innerHTML = `
        <div style="display: flex; flex-direction: column; height: 100vh;">
          <div style="padding: 16px 20px 0 20px; flex-shrink: 0;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
              <div class="logo" style="margin-bottom: 0;">b/</div>
              <div style="display: flex; gap: 8px;">
                <div class="settings-icon" onclick="refreshDashboard()" title="Refresh" style="position: static;"><span id="refresh-icon" style="display:inline-block;">↻</span></div>
                <div class="settings-icon" onclick="showGitHubSettings()" title="GitHub Settings" style="position: static;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
                  </svg>
                </div>
              </div>
            </div>
            <div style="display: flex; margin: 0 -20px; padding: 0 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;">
              <button onclick="switchTab('designer')" style="flex: 1; padding: 9px 0; text-align: center; border: none; border-bottom: 2px solid ${_activeTab === 'designer' ? 'var(--accent)' : 'transparent'}; background: transparent; font-size: 12px; font-weight: 600; cursor: pointer; color: ${_activeTab === 'designer' ? 'var(--accent)' : 'var(--text-muted)'}; margin-bottom: -1px; transition: color 0.15s, border-color 0.15s;">Designer</button>
              <button onclick="switchTab('developer')" style="flex: 1; padding: 9px 0; text-align: center; border: none; border-bottom: 2px solid ${_activeTab === 'developer' ? 'var(--accent)' : 'transparent'}; background: transparent; font-size: 12px; font-weight: 600; cursor: pointer; color: ${_activeTab === 'developer' ? 'var(--accent)' : 'var(--text-muted)'}; margin-bottom: -1px; transition: color 0.15s, border-color 0.15s;">Developer</button>
            </div>
          </div>
          <div id="tab-content" style="flex: 1; overflow-y: auto; min-height: 0; padding: 16px 20px 12px 20px;">
            ${_activeTab === 'designer' ? renderDesignerTabHtml(data) : renderDeveloperTabHtml()}
          </div>
        </div>
      `;
    }

    function switchTab(tab) {
      _activeTab = tab;
      if (_dashboardData) renderDashboard(_dashboardData);
    }

    function renderDesignerTabHtml(data) {
      var gc = data.githubConnected;
      var gr = data.githubRepo || '';
      var vc = data.variableCount || 0;
      return `
        <div class="status-card">
          <div style="font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">Status</div>
          <div class="status-row">
            <span class="status-label">Variables in Figma</span>
            <span class="status-value">${vc}</span>
          </div>

    async function fetchFromGitHub() {
      if (!githubConfig || !githubConfig.token || !githubConfig.owner || !githubConfig.repo || !githubConfig.path) {
        alert('Please configure GitHub settings first');
        showGitHubSettings();
        return;
      }

      try {
        const url = `https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.path}?ref=${githubConfig.branch}`;

        const response = await fetch(url, {
          headers: {
            'Authorization': `token ${githubConfig.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!response.ok) {
          throw new Error(`GitHub API error: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        const content = atob(data.content.replace(/\n/g, ''));
        const raw = JSON.parse(content);

        jsonTokens = normalizeTokens(raw);
        fileName = githubConfig.path.split('/').pop();

        parent.postMessage({
          pluginMessage: {
            type: 'get-variables'
          }
        }, '*');
      } catch (error) {
        alert(`Failed to fetch from GitHub: ${error.message}`);
      }
    }

    async function pushToGitHub(jsonString) {
      const { branch: newBranch, prTitle, prBody } = window._pushData;
      const { token, owner, repo, branch: baseBranch, path } = githubConfig;
      const headers = {
        'Authorization': 'token ' + token,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      };

      try {
        // Step 1: Get base branch SHA — auto-detect default branch if configured one returns 404
        let prBaseBranch = baseBranch;
        let refRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/ref/heads/${prBaseBranch}`, { headers });
        if (!refRes.ok && refRes.status === 404) {
          const repoRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers });
          if (repoRes.ok) {
            const repoInfo = await repoRes.json();
            prBaseBranch = repoInfo.default_branch || prBaseBranch;
            refRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/ref/heads/${prBaseBranch}`, { headers });
          }
        }
        if (!refRes.ok) {
          const errBody = await refRes.json().catch(() => ({}));
          throw new Error(`Could not get base branch "${prBaseBranch}" (${refRes.status}): ${errBody.message || refRes.statusText}`);
        }
        const refData = await refRes.json();
        const commitSha = refData.object.sha;

        // Step 2: Create new branch
        const branchRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs`, {
          method: 'POST',
          headers,
          body: JSON.stringify({ ref: 'refs/heads/' + newBranch, sha: commitSha })
        });
        if (!branchRes.ok) {
          const err = await branchRes.json();
          throw new Error('Could not create branch: ' + (err.message || branchRes.statusText));
        }

        // Step 3: Get existing file SHA (if file already exists, needed to update it)
        let existingFileSha = null;
        const fileRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${newBranch}`, { headers });
        if (fileRes.ok) {
          const fileData = await fileRes.json();
          existingFileSha = fileData.sha;
        }

        // Step 4: Commit token file to new branch
        const contentBody = {
          message: 'chore: update design tokens from Figma',
          content: btoa(unescape(encodeURIComponent(jsonString))),
          branch: newBranch
        };
        if (existingFileSha) contentBody.sha = existingFileSha;

        const commitRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
          method: 'PUT',
          headers,
          body: JSON.stringify(contentBody)
        });
        if (!commitRes.ok) {
          const err = await commitRes.json();
          throw new Error('Could not commit file: ' + (err.message || commitRes.statusText));
        }

        // Step 5: Create Pull Request
        const prRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/pulls`, {
          method: 'POST',
          headers,
          body: JSON.stringify({ title: prTitle, body: prBody, head: newBranch, base: prBaseBranch })
        });
        if (!prRes.ok) {
          const err = await prRes.json();
          throw new Error('Could not create PR: ' + (err.message || prRes.statusText));
        }
        const prData = await prRes.json();

        showPushSuccess(prData.html_url, newBranch);
      } catch (error) {
        alert('Push failed: ' + error.message);
        // Re-enable button so user can retry
        const btn = document.getElementById('push-btn');
        if (btn) { btn.textContent = 'Create Pull Request'; btn.disabled = false; }
      }
    }

    function renderCollections(collections) {
      _allCollections = collections;
      const list = document.getElementById('collections-list');
      if (!list) return;

      if (!collections || collections.length === 0) {
        list.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted); font-size: 12px;">No variable collections found</div>' +
          typographyBlockHtml();
        return;
      }

      list.innerHTML = collections.map(function(col) {
        const vars = col.variables.map(function(v) {
          const isColor = v.type === 'COLOR';
          const swatch = isColor ? '<div class="color-swatch" style="background:' + v.value + ';"></div>' : '';
          const displayVal = isColor ? v.value : String(v.value);
          return `
            <div class="variable-row" draggable="true"
              data-variable-id="${v.id}"
              data-source-collection="${col.id}"
            >
              <input type="checkbox" class="var-checkbox" data-variable-id="${v.id}" data-source-collection="${col.id}"
                style="flex-shrink: 0; cursor: pointer; width: 14px; height: 14px; accent-color: #1E90FF;"
                onclick="handleCheckboxChange(event)" />
              <span class="drag-handle" style="cursor: grab;">⠿</span>
              <span class="var-type-badge var-type-${v.type}">${v.type === 'FLOAT' ? 'NUM' : v.type.slice(0,3)}</span>
              ${swatch}
              <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary);">${v.name}</span>
              <span style="color: var(--text-muted); font-size: 11px; flex-shrink: 0;">${displayVal}</span>
            </div>
          `;
        }).join('');

        return `
          <div class="collection-block" data-collection-id="${col.id}" style="margin-bottom: 12px;">
            <div class="collection-header"
              data-collection-id="${col.id}"
              onclick="toggleCollection(event, '${col.id}')"
              ondragover="handleColDragOver(event, this)"
              ondragleave="handleColDragLeave(this)"
              ondrop="handleColDrop(event, '${col.id}', this)"
            >
              <span class="collection-chevron">▸</span>
              <input type="checkbox" class="col-select-all" data-collection-id="${col.id}"
                style="margin-right: 8px; cursor: pointer; width: 13px; height: 13px; accent-color: #1E90FF;"
                onclick="handleSelectAll(event, '${col.id}')" />
              <span style="margin-right: 8px;">📁</span>
              <span>${col.name}</span>
              <span class="col-count" style="margin-left: auto; color: var(--text-muted); font-weight: 400;">${col.variables.length} var${col.variables.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="variables-container" data-collection-id="${col.id}" style="display: none;">${vars}</div>
          </div>
        `;
      }).join('') + typographyBlockHtml();

      // Attach drag events
      list.querySelectorAll('.variable-row').forEach(function(row) {
        row.addEventListener('dragstart', function(e) {
          // If dragging a checked item, drag all checked; otherwise just this one
          const checked = getCheckedIds();
          const thisId = row.dataset.variableId;
          if (checked.length > 0 && checked.includes(thisId)) {
            e.dataTransfer.setData('variableIds', JSON.stringify(checked));
          } else {
            e.dataTransfer.setData('variableIds', JSON.stringify([thisId]));
            e.dataTransfer.setData('sourceCollectionId', row.dataset.sourceCollection);
          }
          e.dataTransfer.effectAllowed = 'move';
          setTimeout(function() { row.classList.add('dragging'); }, 0);
        });
        row.addEventListener('dragend', function() {
          row.classList.remove('dragging');
          document.querySelectorAll('.collection-header').forEach(function(h) { h.classList.remove('drag-over'); });
        });
      });
    }

    function filterTokens(query) {
      _tokenSearchQuery = query.toLowerCase().trim();
      var rows = document.querySelectorAll('.variable-row');
      var blocks = document.querySelectorAll('.collection-block');
      if (!_tokenSearchQuery) {
        rows.forEach(function(r) { r.style.display = ''; });
        blocks.forEach(function(b) {
          b.style.display = '';
          var container = b.querySelector('.variables-container');
          if (container) container.style.display = b.classList.contains('open') ? '' : 'none';
        });
        return;
      }
      blocks.forEach(function(block) {
        var container = block.querySelector('.variables-container');
        var anyVisible = false;
        block.querySelectorAll('.variable-row').forEach(function(row) {
          var name = (row.querySelector('span[style*="flex: 1"]') || row.querySelector('span[style*="flex:1"]') || {}).textContent || '';
          var val = (row.querySelector('span[style*="text-muted"]') || {}).textContent || '';
          var match = name.toLowerCase().includes(_tokenSearchQuery) || val.toLowerCase().includes(_tokenSearchQuery);
          row.style.display = match ? '' : 'none';
          if (match) anyVisible = true;
        });
        block.style.display = anyVisible ? '' : 'none';
        if (anyVisible && container) container.style.display = '';
      });
    }

    // ── Minimal zip builder (stored / no compression) ──
    // Produces a valid .zip from { name, content: string } entries.
    var _crcTable = null;
    function _getCrcTable() {
      if (_crcTable) return _crcTable;
      _crcTable = new Uint32Array(256);
      for (var n = 0; n < 256; n++) {
        var c = n;
        for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        _crcTable[n] = c >>> 0;
      }
      return _crcTable;
    }
    function _crc32(bytes) {
      var table = _getCrcTable();
      var crc = 0xFFFFFFFF;
      for (var i = 0; i < bytes.length; i++) crc = table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }
    function createZip(files) {
      const encoder = new TextEncoder();
      const entries = files.map(function(f) {
        const nameBytes = encoder.encode(f.name);
        const data = encoder.encode(f.content);
        return { name: f.name, nameBytes: nameBytes, data: data, crc: _crc32(data) };
      });
      const chunks = [];
      let offset = 0;
      const centralRecords = [];
      for (const e of entries) {
        const headerBuf = new ArrayBuffer(30 + e.nameBytes.length);
        const v = new DataView(headerBuf);
        v.setUint32(0, 0x04034b50, true);
        v.setUint16(4, 20, true);
        v.setUint16(6, 0, true);
        v.setUint16(8, 0, true); // store
        v.setUint16(10, 0, true);
        v.setUint16(12, 0, true);
        v.setUint32(14, e.crc, true);
        v.setUint32(18, e.data.length, true);
        v.setUint32(22, e.data.length, true);
        v.setUint16(26, e.nameBytes.length, true);
        v.setUint16(28, 0, true);
        const header = new Uint8Array(headerBuf);
        header.set(e.nameBytes, 30);
        centralRecords.push({ entry: e, headerOffset: offset });
        chunks.push(header); offset += header.length;
        chunks.push(e.data); offset += e.data.length;
      }
      const centralStart = offset;
      for (const c of centralRecords) {
        const e = c.entry;
        const buf = new ArrayBuffer(46 + e.nameBytes.length);
        const v = new DataView(buf);
        v.setUint32(0, 0x02014b50, true);
        v.setUint16(4, 20, true);
        v.setUint16(6, 20, true);
        v.setUint16(8, 0, true);
        v.setUint16(10, 0, true);
        v.setUint16(12, 0, true);
        v.setUint16(14, 0, true);
        v.setUint32(16, e.crc, true);
        v.setUint32(20, e.data.length, true);
        v.setUint32(24, e.data.length, true);
        v.setUint16(28, e.nameBytes.length, true);
        v.setUint16(30, 0, true);
        v.setUint16(32, 0, true);
        v.setUint16(34, 0, true);
        v.setUint16(36, 0, true);
        v.setUint32(38, 0, true);
        v.setUint32(42, c.headerOffset, true);
        const arr = new Uint8Array(buf);
        arr.set(e.nameBytes, 46);
        chunks.push(arr); offset += arr.length;
      }
      const centralSize = offset - centralStart;
      const eocdBuf = new ArrayBuffer(22);
      const ev = new DataView(eocdBuf);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(4, 0, true);
      ev.setUint16(6, 0, true);
      ev.setUint16(8, entries.length, true);
      ev.setUint16(10, entries.length, true);
      ev.setUint32(12, centralSize, true);
      ev.setUint32(16, centralStart, true);
      ev.setUint16(20, 0, true);
      chunks.push(new Uint8Array(eocdBuf));
      const total = chunks.reduce(function(s, c) { return s + c.length; }, 0);
      const out = new Uint8Array(total);
      let p = 0;
      for (const c of chunks) { out.set(c, p); p += c.length; }
      return out;
    }

    // Holds buffered exports when we need to bundle into a zip.
    var _zipBuffer = null;

    function exportFromSelection() {
      const folderIds = getCheckedFolderIds();
      const hasTypography = folderIds.indexOf('__typography__') !== -1;
      const variableCollectionIds = folderIds.filter(function(id) { return id !== '__typography__'; });
      // Default (nothing selected) = export everything
      const exportTypography = hasTypography || folderIds.length === 0;
      const exportVariables = folderIds.length === 0 || variableCollectionIds.length > 0;

      if (exportVariables && exportTypography) {
        // Need both — collect into a zip and download once
        _zipBuffer = { variables: null, typography: null };
        const tokensPayload = { type: 'export-tokens' };
        if (variableCollectionIds.length > 0) tokensPayload.collectionIds = variableCollectionIds;
        parent.postMessage({ pluginMessage: tokensPayload }, '*');
        parent.postMessage({ pluginMessage: { type: 'export-text-styles' } }, '*');
        return;
      }

      if (exportTypography) {
        parent.postMessage({ pluginMessage: { type: 'export-text-styles' } }, '*');
        return;
      }

      // Variables only (or default = all)
      const payload = { type: 'export-tokens' };
      if (variableCollectionIds.length > 0) payload.collectionIds = variableCollectionIds;
      parent.postMessage({ pluginMessage: payload }, '*');
    }

    async function runTokenDiff() {
      var body = document.getElementById('diff-body');
      if (!body) return;
      if (!githubConfig || !githubConfig.token || !githubConfig.owner || !githubConfig.repo || !githubConfig.path) {
        body.innerHTML = '<div style="color:#f59e0b;font-size:11px;line-height:1.5;">GitHub not configured — set it up via the ⚙ icon on the dashboard.</div>';
        return;
      }
      body.innerHTML = '<div style="color:var(--text-muted);font-size:11px;padding:4px 0;">Fetching from GitHub…</div>';
      try {
        var url = 'https://api.github.com/repos/' + githubConfig.owner + '/' + githubConfig.repo + '/contents/' + githubConfig.path + '?ref=' + githubConfig.branch;
        var res = await fetch(url, { headers: { 'Authorization': 'token ' + githubConfig.token, 'Accept': 'application/vnd.github.v3+json' } });
        if (!res.ok) throw new Error('GitHub: ' + res.status + ' ' + res.statusText);
        var data = await res.json();
        var raw = JSON.parse(atob(data.content.replace(/\n/g, '')));
        var githubFlat = flattenForDiff(raw);
        if (body) body.innerHTML = '<div style="color:var(--text-muted);font-size:11px;padding:4px 0;">Fetching Figma variables…</div>';
        window._diffGithub = githubFlat;
        parent.postMessage({ pluginMessage: { type: 'get-all-variables-for-diff' } }, '*');
      } catch (e) {
        if (body) body.innerHTML = '<div style="color:#ef4444;font-size:11px;">' + escHtml(String(e)) + '</div>';
      }
    }

    function flattenForDiff(obj) {
      var result = {};
      function walk(o, prefix) {
        for (var k in o) {
          var fullKey = prefix ? prefix + '/' + k : k;
          var v = o[k];
          if (v && typeof v === 'object' && !Array.isArray(v)) {
            var hasValue = '$value' in v || 'value' in v;
            if (hasValue) {
              result[fullKey] = String(v.$value !== undefined ? v.$value : v.value);
            } else {
              walk(v, fullKey);
            }
          } else if (v !== null && v !== undefined && typeof v !== 'object') {
            result[fullKey] = String(v);
          }
        }
      }
      walk(obj, '');
      return result;
    }

    function renderTokenDiff(figmaVars) {
      var body = document.getElementById('diff-body');
      if (!body || !window._diffGithub) return;
      var github = window._diffGithub;

      var figmaMap = {};
      figmaVars.forEach(function(v) { figmaMap[v.name] = v.value; });

      var added = [], removed = [], changed = [];
      for (var k in figmaMap) {
        if (!(k in github)) added.push(k);
        else if (String(figmaMap[k]) !== String(github[k])) changed.push({ name: k, figma: figmaMap[k], github: github[k] });
      }
      for (var k in github) {
        if (!(k in figmaMap)) removed.push(k);
      }

      if (!added.length && !removed.length && !changed.length) {
        body.innerHTML = '<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#22c55e;padding:6px 0;"><span>✓</span>Figma and GitHub are in sync — no differences found.</div>';
        return;
      }

      var html = '<div style="display:flex;gap:10px;font-size:11px;font-weight:600;margin-bottom:8px;">' +
        (added.length ? '<span style="color:#22c55e;">+' + added.length + ' added</span>' : '') +
        (removed.length ? '<span style="color:#ef4444;">−' + removed.length + ' removed</span>' : '') +
        (changed.length ? '<span style="color:#f59e0b;">~' + changed.length + ' changed</span>' : '') +
        '</div>';

      function row(label, name, extra) {
        return '<div style="display:flex;align-items:baseline;gap:6px;padding:5px 8px;font-size:11px;border-bottom:1px solid var(--border);">' +
          '<span style="font-size:10px;font-weight:700;width:14px;flex-shrink:0;color:' + (label === '+' ? '#22c55e' : label === '−' ? '#ef4444' : '#f59e0b') + ';">' + label + '</span>' +
          '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary);">' + escHtml(name) + '</span>' +
          (extra ? '<span style="color:var(--text-muted);font-family:monospace;font-size:10px;flex-shrink:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;">' + escHtml(extra) + '</span>' : '') +
          '</div>';
      }

      html += '<div style="border:1px solid var(--border);border-radius:6px;overflow:hidden;max-height:280px;overflow-y:auto;">';
      changed.forEach(function(c) { html += row('~', c.name, c.github + ' → ' + c.figma); });
      added.forEach(function(n) { html += row('+', n, figmaMap[n]); });
      removed.forEach(function(n) { html += row('−', n, github[n]); });
      html += '</div>';

      body.innerHTML = html;
    }

    function setupUploadListeners() {

      if (!newFileInput || !newDropzone) return;

      newDropzone.addEventListener('dragover', handleDragOver);

      newDropzone.addEventListener('drop', handleDrop);
      newFileInput.addEventListener('change', handleFileInput);

    function handleDragOver(e) {
      e.preventDefault();
      e.currentTarget.style.borderColor = '#18A0FB';
      e.currentTarget.style.backgroundColor = '#f0f8ff';
    }

    function handleDragLeave(e) {
      e.preventDefault();

      e.currentTarget.style.backgroundColor = '#fafafa';
    }

    function handleDrop(e) {
      e.preventDefault();
      e.currentTarget.style.borderColor = '';
      e.currentTarget.style.backgroundColor = '#fafafa';

      const files = e.dataTransfer.files;
      if (files.length > 0) {
        processFile(files[0]);
      }
    }

    function handleFileInput(e) {
      const files = e.target.files;
      if (files.length > 0) {
        processFile(files[0]);

    setupUploadListeners();

    function processFile(file) {
      console.log('Processing file:', file.name);
      fileName = file.name;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const raw = JSON.parse(e.target.result);
          console.log('JSON parsed:', raw);
          jsonTokens = normalizeTokens(raw);
          console.log('Normalized tokens:', jsonTokens);
          parent.postMessage({ pluginMessage: { type: 'get-variables' } }, '*');
        } catch (error) {
          alert('Error parsing JSON file: ' + error);
        }
      };
      reader.readAsText(file);
    }

    // Detects and normalizes any known token format into the canonical flat structure:
    // { "group/token": { $value: ..., $type: ... } }
    function normalizeTokens(raw) {
      // Format 1: Array of collection objects: [{ "Collection Name": { modes: { "Mode": { tokens } } } }]
      if (Array.isArray(raw)) {
        var result = {};
        raw.forEach(function(collectionObj) {
          Object.keys(collectionObj).forEach(function(collectionName) {
            var collection = collectionObj[collectionName];
            if (collection && collection.modes && typeof collection.modes === 'object') {
              var modeNames = Object.keys(collection.modes);
              if (modeNames.length > 0) {
                Object.assign(result, extractTokens(collection.modes[modeNames[0]], ''));
              }
            } else {
              Object.assign(result, extractTokens(collection, ''));
            }
          });
        });
        return result;
      }

      // Format 2: Explicit "modes" key: { modes: { "Mode": { tokens } } }
      if (raw && raw.modes && typeof raw.modes === 'object') {
        var modeNames = Object.keys(raw.modes);
        if (modeNames.length > 0) {
          return extractTokens(raw.modes[modeNames[0]], '');
        }
      }

      // Format 3: Single wrapper key containing mode-like children
      // e.g. { "styles": { "light": { "background": "#fff" }, "dark": { ... } } }
      // Detects when there's one top-level key whose children are all objects (potential modes)
      var topKeys = Object.keys(raw);
      if (topKeys.length === 1) {
        var wrapper = raw[topKeys[0]];
        if (wrapper && typeof wrapper === 'object' && !('$value' in wrapper) && !('value' in wrapper)) {
          var childKeys = Object.keys(wrapper);
          var allChildrenAreGroups = childKeys.length > 0 && childKeys.every(function(k) {
            return wrapper[k] && typeof wrapper[k] === 'object' && !('$value' in wrapper[k]) && !('value' in wrapper[k]);
          });
          if (allChildrenAreGroups) {
            // Treat children as modes — use the first one
            return extractTokens(wrapper[childKeys[0]], '');
          }
        }
      }

      // Format 4: Top-level keys are all parallel mode-like objects sharing common token keys
      // e.g. { "light": { "background": "#fff", "primary": "#000" }, "dark": { "background": "#000", ... } }
      if (topKeys.length >= 2) {
        var allAreGroups = topKeys.every(function(k) {
          return raw[k] && typeof raw[k] === 'object' && !('$value' in raw[k]) && !('value' in raw[k]);
        });
        if (allAreGroups) {
          var firstModeKeys = Object.keys(raw[topKeys[0]]);
          var hasSharedKeys = topKeys.slice(1).some(function(k) {
            return Object.keys(raw[k]).some(function(ck) { return firstModeKeys.indexOf(ck) !== -1; });
          });
          if (hasSharedKeys) {
            // These look like parallel modes — use the first one
            return extractTokens(raw[topKeys[0]], '');
          }
        }
      }

      // Format 5: DTCG / Style Dictionary nested structure (default)
      return extractTokens(raw, '');
    }

    // Recursively extracts tokens from a nested object into flat { "path/to/token": { $value, $type } }
    function extractTokens(obj, prefix) {
      var result = {};
      if (!obj || typeof obj !== 'object') return result;

      Object.keys(obj).forEach(function(key) {
        // Skip metadata keys
        if (key === '$scopes' || key === '$description' || key === '$extensions') return;

        var val = obj[key];
        var fullName = prefix ? prefix + '/' + key : key;

        if (val !== null && val !== undefined && typeof val !== 'object') {
          // Primitive value (string, number, boolean) — treat as a token directly
          result[fullName] = {
            $value: val,
            $type: guessType(val)
          };
        } else if (val && typeof val === 'object') {
          var hasValue = '$value' in val || 'value' in val;

          if (hasValue) {
            // It's a token — normalize to canonical form
            result[fullName] = {
              $value: val.$value !== undefined ? val.$value : val.value,
              $type: val.$type || val.type || guessType(val.$value !== undefined ? val.$value : val.value)
            };
          } else {
            // It's a group — recurse
            Object.assign(result, extractTokens(val, fullName));
          }
        }
      });

      return result;
    }

    // Guesses token type from value if $type is missing
    function guessType(value) {
      if (typeof value === 'boolean') return 'boolean';
      if (typeof value === 'number') return 'float';
      if (typeof value === 'string') {
        if (/^#([0-9a-fA-F]{3,8})$/.test(value)) return 'color';
        if (/^rgba?\(/.test(value)) return 'color';
        if (/^\d+(\.\d+)?(px|rem|em|%)$/.test(value)) return 'dimension';
        if (/^\d+(\.\d+)?$/.test(value)) return 'float';
      }
      return 'string';
    }

    function flattenTokens(obj, prefix) {
      prefix = prefix || '';
      var normalized = normalizeTokens(obj);
      var result = {};

      for (var key in normalized) {
        var value = normalized[key];
        result[key] = {
          value: value.$value,
          type: value.$type || 'string'
        };
      }

      return result;
    }

    function formatValue(value, type) {
      if (type === 'color' && typeof value === 'object' && value.r !== undefined) {
        const r = Math.round(value.r * 255);
        const g = Math.round(value.g * 255);
        const b = Math.round(value.b * 255);
        const hex = '#' + [r, g, b].map(function(x) {
          return x.toString(16).padStart(2, '0');
        }).join('');
        return hex;
      }
      return String(value);
    }

    function showComparison(variables) {
      figmaVariables = variables;
      const flatTokens = flattenTokens(jsonTokens);
      const toUpdate = [];
      const toCreate = [];

      for (const tokenName in flatTokens) {
        const token = flatTokens[tokenName];
        const matchingVar = variables.find(function(v) { return v.name === tokenName; });

        if (matchingVar) {
          toUpdate.push({
            name: tokenName,
            figmaValue: matchingVar.value,
            jsonValue: token.value,
            type: token.type || 'string',
            action: 'update'
          });
        } else {
          toCreate.push({
            name: tokenName,
            jsonValue: token.value,
            type: token.type || 'string',
            action: 'create'
          });
        }
      }

      const totalCount = toUpdate.length + toCreate.length;

      if (totalCount === 0) {
        document.getElementById('root').innerHTML = `
          <div class="logo">b/</div>
          <h2 style="margin: 0 0 8px 0; font-size: 16px; font-weight: 600; color: var(--text-primary);">No Tokens Found</h2>
          <div style="padding: 20px; text-align: center; background-color: var(--surface); border-radius: 8px; font-size: 12px; color: var(--text-secondary); border: 1px solid var(--border);">
            No tokens found in the JSON file
          </div>
          <button class="button-secondary" onclick="resetToUpload()">Go Back</button>
        `;
        return;
      }

      let allTokensHTML = '';
      const allTokens = toCreate.concat(toUpdate);

      allTokensHTML = allTokens.map(function(token) {
        const isUpdate = token.action === 'update';
        return `
          <div class="token-card">
            <div class="token-name">${token.name}</div>
            <div class="token-details">
              <div class="token-pill">
                <span class="token-label">Value:</span>
                <span>${formatValue(isUpdate ? token.jsonValue : token.jsonValue, token.type)}</span>
              </div>
              <div class="token-pill">
                <span class="token-label">Type:</span>
                <span>${token.type}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('root').innerHTML = `
        <div style="display: flex; flex-direction: column; height: 100vh; padding: 20px 20px 0 20px;">
          <div>
            <div class="logo">b/</div>

            <h2 style="margin: 0 0 4px 0; font-size: 16px; font-weight: 600; color: var(--text-primary);">Token Review</h2>
            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">File: ${fileName}</div>

            <div class="stats-line">
              ${toCreate.length > 0 ? toCreate.length + '/' + totalCount + ' created' : totalCount + ' token' + (totalCount !== 1 ? 's' : '')}
            </div>

            <div style="font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">
              ${toCreate.length > 0 ? 'New Tokens' : 'Tokens to Update'}
            </div>
          </div>

          <div style="flex: 1; overflow-y: auto; min-height: 0; margin-bottom: 16px;">
            ${allTokensHTML}
          </div>

          <div style="background-color: var(--bg); padding: 16px 0 12px 0;">
            <button class="button-primary" onclick="handleReplace()">Apply</button>
            <button class="button-secondary" onclick="resetToUpload()">Go Back</button>
          </div>
        </div>
      `;
    }

    function handleReplace() {
      parent.postMessage({
        pluginMessage: {
          type: 'replace-tokens',
          tokens: jsonTokens
        }
      }, '*');
    }

    function showSuccess(results) {
      const updated = results.updated || 0;
      const created = results.created || 0;
      const skipped = results.skipped || 0;
      const total = updated + created;

      let detailsHTML = '';
      if (updated > 0 || created > 0) {
        detailsHTML = `
          <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.6;">
            <div style="margin-bottom: 4px;"><strong style="color: var(--text-primary);">${total}</strong> variable${total !== 1 ? 's' : ''} ${updated > 0 ? 'updated' : 'created'}</div>
            ${skipped > 0 ? '<div class="error-badge">' + skipped + ' skipped (errors)</div>' : ''}
          </div>
        `;
      }

      document.getElementById('root').innerHTML = `
        <div style="text-align: center; padding-top: 80px;">
          <div class="logo" style="margin: 0 auto 32px;">b/</div>
          <div class="success-icon">✓</div>
          <h2 style="margin: 0 0 16px 0; font-size: 18px; font-weight: 600; color: var(--text-primary);">Import Complete</h2>
          ${detailsHTML}
          <button class="button-primary" onclick="showDashboard()">Back to Dashboard</button>
        </div>
      `;
    }

    var _inspectFixData = [];

    function navigateToNode(nodeId) {
      parent.postMessage({ pluginMessage: { type: 'navigate-to-node', nodeId: nodeId } }, '*');
    }

    function fixIssue(fixIndex) {
      var data = _inspectFixData[fixIndex];
      if (!data) return;
      parent.postMessage({ pluginMessage: Object.assign({ type: 'fix-issue' }, data) }, '*');
    }

    function fixAll() {
      var problemFixes = _inspectFixData.filter(function(d) { return d.status !== 'ok'; });
      if (!problemFixes.length) return;
      parent.postMessage({ pluginMessage: { type: 'fix-all-issues', fixes: problemFixes } }, '*');
    }

    // ── Inspect screen ──────────────────────────────────────────────────────

    function showInspectScreen() {
      document.getElementById('root').innerHTML = `
        <div style="display: flex; flex-direction: column; height: 100vh; padding: 20px 20px 0 20px;">
          <div class="screen-header">
            <div class="back-icon" onclick="leaveInspectScreen()">←</div>
            <div>
              <p class="screen-title">Inspect component</p>
              <p class="screen-subtitle" id="inspect-subtitle">Select a component on the canvas</p>
            </div>
          </div>
          <div id="inspect-body" style="flex: 1; overflow-y: auto; min-height: 0; padding-bottom: 12px;">
            <div class="inspect-empty">
              <div style="font-size: 32px;">🔍</div>
              <div>Select any component, frame, or layer on the canvas</div>
              <div style="font-size: 11px; color: var(--text-muted);">
                ${_selectedTheme ? 'Checking against theme: <strong>' + _selectedTheme + '</strong>' : 'No theme selected — will only check for hardcoded colors'}
              </div>
            </div>

    function leaveInspectScreen() {
      parent.postMessage({ pluginMessage: { type: 'deactivate-inspect' } }, '*');
      showDashboard();
    }

    function issueRowHtml(iss, nodeId) {
      var dot = '<span class="status-dot ' + iss.status + '"></span>';
      var isColor = iss.category === 'color' || !iss.category;
      var isSpacing = iss.category === 'spacing';
      var chip = isColor && iss.colorHex ? '<span class="color-chip" style="background:' + iss.colorHex + ';"></span>' : '';
      var fixBtn = '';
      if (iss.status !== 'ok' && iss.category !== 'typography') {
        var fixIndex = _inspectFixData.length;
        _inspectFixData.push({ nodeId: nodeId, propertyRaw: iss.property, status: iss.status, variableName: iss.variableName || '' });
        fixBtn = '<button type="button" class="inspect-fix-btn" onclick="fixIssue(' + fixIndex + ')">Fix</button>';
      }
      var label = '';
      if (iss.status === 'hardcoded') {
        if (isSpacing) {
          label = '<span style="color:var(--text-secondary);">' + iss.property + '</span> ' +
                  '<span style="font-family:monospace;color:var(--text-primary);">' + iss.currentValue + '</span> ' +
                  '<span style="color:#ef4444;font-weight:600;">hardcoded</span>';
        } else if (!isColor) {
          label = '<span style="color:var(--text-secondary);">no text style · </span>' +
                  '<span style="font-family:monospace;color:var(--text-muted);">' + (iss.currentValue || '') + '</span> ' +
                  '<span style="color:#ef4444;font-weight:600;">missing</span>';
        } else {
          label = '<span style="color:var(--text-secondary);">' + iss.property + '</span> ' +
                  '<span style="font-family:monospace;color:var(--text-primary);">' + iss.colorHex + '</span> ' +
                  '<span style="color:#ef4444;font-weight:600;">hardcoded</span>';
        }
      } else if (iss.status === 'mismatch') {
        var expChip = iss.expectedHex ? '<span class="color-chip" style="background:' + iss.expectedHex + ';"></span>' : '';
        label = '<span style="color:var(--text-secondary);">' + iss.property + '</span> ' +
                chip + '<span style="color:var(--text-muted);margin:0 4px;">→</span>' + expChip + ' ' +
                '<span style="color:#f59e0b;font-weight:600;">wrong value</span>' +
                (iss.variableName ? ' <span style="color:var(--text-muted);">(' + iss.variableName + ')</span>' : '');
      } else {
        if (isSpacing) {
          label = '<span style="color:var(--text-secondary);">' + iss.property + '</span> ' +
                  '<span style="font-family:monospace;color:var(--text-primary);">' + iss.currentValue + '</span> ' +
                  '<span style="color:#22c55e;font-weight:600;">bound</span>' +
                  (iss.variableName ? ' <span style="color:var(--text-muted);">(' + iss.variableName + ')</span>' : '');
        } else if (!isColor) {
          label = '<span style="color:var(--text-secondary);">textStyle</span> ' +
                  '<span style="color:#22c55e;font-weight:600;">applied</span>' +
                  (iss.variableName ? ' <span style="color:var(--text-muted);">(' + iss.variableName + ')</span>' : '');
        } else {
          var expChip2 = iss.expectedHex ? '<span class="color-chip" style="background:' + iss.expectedHex + ';"></span>' : chip;
          label = '<span style="color:var(--text-secondary);">' + iss.property + '</span> ' +
                  expChip2 + ' ' +
                  '<span style="color:#22c55e;font-weight:600;">' + (iss.tokenName || 'ok') + '</span>' +
                  (iss.variableName ? ' <span style="color:var(--text-muted);">(' + iss.variableName + ')</span>' : '');
        }
      }
      return '<div class="inspect-issue-row">' + dot + chip + '<span style="flex:1;line-height:1.4;">' + label + '</span>' + fixBtn + '</div>';
    }

    function nodeCardHtml(node) {
      var typeIcon = node.nodeType === 'COMPONENT' ? '◈' :
                     node.nodeType === 'INSTANCE'  ? '◇' :
                     node.nodeType === 'FRAME'     ? '▭' :
                     node.nodeType === 'TEXT'      ? 'T' : '·';

      var problemIssues = node.issues.filter(function(i) { return i.status !== 'ok'; });
      var okIssues      = node.issues.filter(function(i) { return i.status === 'ok'; });

      var header = '<div class="inspect-node-header">' +
        '<span style="color:var(--text-muted);font-size:11px;font-weight:700;">' + typeIcon + '</span>' +
        '<span>' + node.nodeName + '</span>' +
        '<span class="inspect-node-path" style="margin-right:4px;">' + node.path + '</span>' +
        '<button onclick="navigateToNode(\'' + node.nodeId + '\')" title="Select in Figma" style="flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:4px;cursor:pointer;color:var(--accent);font-size:10px;padding:2px 6px;font-weight:700;line-height:1.3;transition:all 0.15s;" onmouseover="this.style.background=\'var(--accent)\';this.style.color=\'white\'" onmouseout="this.style.background=\'var(--surface)\';this.style.color=\'var(--accent)\'">↗</button>' +
        '</div>';

      var problemRows = problemIssues.map(function(iss) { return issueRowHtml(iss, node.nodeId); }).join('');

      var okAccordion = '';
      if (okIssues.length > 0) {
        okAccordion = '<details>' +
          '<summary class="inspect-accordion-summary">' +
            '<span class="chevron">▸</span>' +
            '<span class="status-dot ok"></span>' +
            okIssues.length + ' correct value' + (okIssues.length !== 1 ? 's' : '') +
          '</summary>' +
          okIssues.map(function(iss) { return issueRowHtml(iss, node.nodeId); }).join('') +
        '</details>';
      }

      return '<div class="inspect-node-card">' + header + problemRows + okAccordion + '</div>';
    }

    function renderInspectResults(msg) {
      var body = document.getElementById('inspect-body');
      var subtitle = document.getElementById('inspect-subtitle');
      if (!body) return;

      if (msg.empty) {
        if (subtitle) subtitle.textContent = 'Select a component on the canvas';
        body.innerHTML = '<div class="inspect-empty">' +
          '<div style="font-size:32px;">🔍</div>' +
          '<div>Select any component, frame, or layer on the canvas</div>' +
          (msg.themeName ? '<div style="font-size:11px;color:var(--text-muted);">Checking against: <strong>' + msg.themeName + '</strong></div>' : '') +
          '</div>';
        return;
      }

      var nodes = msg.nodes || [];
      var totalScanned = msg.totalScanned || 0;

      _inspectFixData = [];

      var hardcoded = 0, mismatched = 0, ok = 0;
      var spacingHardcoded = 0, typoHardcoded = 0;
      nodes.forEach(function(n) {
        n.issues.forEach(function(iss) {
          if (iss.status === 'hardcoded') {
            hardcoded++;
            if (iss.category === 'spacing') spacingHardcoded++;
            else if (iss.category === 'typography') typoHardcoded++;
          } else if (iss.status === 'mismatch') mismatched++;
          else ok++;
        });
      });

      if (subtitle) {
        subtitle.textContent = totalScanned + ' layer' + (totalScanned !== 1 ? 's' : '') + ' scanned' +
          (msg.themeName ? ' · ' + msg.themeName : '');
      }

      var nodesWithProblems = nodes.filter(function(n) {
        return n.issues.some(function(i) { return i.status !== 'ok'; });
      });
      var nodesAllOk = nodes.filter(function(n) {
        return n.issues.length > 0 && n.issues.every(function(i) { return i.status === 'ok'; });
      });

      var colorHardcoded = hardcoded - spacingHardcoded - typoHardcoded;
      var fixableProblems = hardcoded - typoHardcoded + mismatched;
      var summary = '<div class="inspect-summary">' +
        (colorHardcoded > 0 ? '<span class="summary-pill"><span class="status-dot hardcoded"></span>' + colorHardcoded + ' color</span>' : '') +
        (mismatched > 0 ? '<span class="summary-pill"><span class="status-dot mismatch"></span>' + mismatched + ' wrong value</span>' : '') +
        (spacingHardcoded > 0 ? '<span class="summary-pill"><span class="status-dot hardcoded"></span>' + spacingHardcoded + ' spacing</span>' : '') +
        (typoHardcoded > 0 ? '<span class="summary-pill"><span class="status-dot hardcoded"></span>' + typoHardcoded + ' text style</span>' : '') +
        (ok > 0 ? '<span class="summary-pill"><span class="status-dot ok"></span>' + ok + ' correct</span>' : '') +
        (fixableProblems > 1 ? '<button type="button" class="inspect-fix-all-btn" onclick="fixAll()">Fix all (' + fixableProblems + ')</button>' : '') +
        '</div>';

      if (hardcoded === 0 && mismatched === 0) {
        // All correct — show everything in one big accordion
        var allRows = nodes.map(nodeCardHtml).join('');
        body.innerHTML = summary + contrastHtml(msg.contrastChecks) +
          '<details>' +
            '<summary class="inspect-accordion-summary" style="border:1px solid var(--border);border-radius:8px;">' +
              '<span class="chevron">▸</span>' +
              '<span class="status-dot ok"></span>' +
              'All ' + ok + ' values correct — expand to review' +
            '</summary>' +
            allRows +
          '</details>';
        return;
      }

      var problemCards = nodesWithProblems.map(nodeCardHtml).join('');

      var okSection = '';
      if (nodesAllOk.length > 0) {
        var okCount = nodesAllOk.reduce(function(s, n) { return s + n.issues.length; }, 0);
        okSection = '<details style="margin-top:8px;">' +
          '<summary class="inspect-accordion-summary" style="border:1px solid var(--border);border-radius:8px;">' +
            '<span class="chevron">▸</span>' +

            ' (' + okCount + ' value' + (okCount !== 1 ? 's' : '') + ')' +
          '</summary>' +
          nodesAllOk.map(nodeCardHtml).join('') +
        '</details>';
      }

      body.innerHTML = summary + contrastHtml(msg.contrastChecks) + problemCards + okSection;
    }

    function contrastHtml(checks) {
      if (!checks || checks.length === 0) return '';

      var passCount = checks.filter(function(c) { return c.aaPass; }).length;
      var failCount = checks.length - passCount;

      var badgeColor = failCount > 0 ? '#ef4444' : '#22c55e';
      var badgeText = failCount > 0
        ? failCount + ' fail'
        : 'All pass';

      var rows = checks.map(function(c) {
        var ratioStr = c.ratio.toFixed(2) + ':1';
        var aaBadge = c.aaPass
          ? '<span style="background:#22c55e;color:white;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;">AA ✓</span>'
          : '<span style="background:#ef4444;color:white;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;">AA ✗</span>';
        var aaaBadge = c.aaaPass
          ? '<span style="background:#22c55e;color:white;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;">AAA ✓</span>'
          : '<span style="background:#94a3b8;color:white;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;">AAA ✗</span>';
        var sizeLabel = c.isLargeText
          ? '<span style="color:var(--text-muted);font-size:10px;">large</span>'
          : '<span style="color:var(--text-muted);font-size:10px;">normal</span>';
        var swatches = '<span style="display:inline-flex;align-items:center;gap:2px;flex-shrink:0;">' +
          '<span style="width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,0.1);background:' + c.textHex + ';display:inline-block;" title="Text: ' + c.textHex + '"></span>' +
          '<span style="font-size:9px;color:var(--text-muted);">on</span>' +
          '<span style="width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,0.1);background:' + c.bgHex + ';display:inline-block;" title="BG: ' + c.bgHex + '"></span>' +
          '</span>';
        var rowBg = c.aaPass ? '' : 'background:rgba(239,68,68,0.04);';
        return '<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border);' + rowBg + '">' +
          swatches +
          '<span style="flex:1;min-width:0;font-size:11px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + c.path + '">' + c.nodeName + '</span>' +
          sizeLabel +
          '<span style="font-family:monospace;font-size:11px;font-weight:600;color:' + (c.aaPass ? 'var(--text-primary)' : '#ef4444') + ';flex-shrink:0;">' + ratioStr + '</span>' +
          '<span style="display:flex;gap:3px;flex-shrink:0;">' + aaBadge + aaaBadge + '</span>' +
          '</div>';
      }).join('');

      return '<div style="margin-bottom:12px;border:1px solid var(--border);border-radius:8px;overflow:hidden;">' +
        '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--border);">' +
          '<span style="font-size:12px;font-weight:600;color:var(--text-primary);">Contrast</span>' +
          '<span style="background:' + badgeColor + ';color:white;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;">' + badgeText + '</span>' +
          '<span style="margin-left:auto;font-size:10px;color:var(--text-muted);">WCAG 2.1</span>' +
        '</div>' +
        rows +
      '</div>';
    }

      var ids = Array.from(document.querySelectorAll('.unused-cb:checked')).map(function(cb) { return cb.dataset.id; });

      if (body) body.innerHTML = '<div class="inspect-empty"><div style="font-size:32px;">⏳</div><div>Deleting…</div></div>';

    function loadComponentTokens() {
      var body = document.getElementById('component-tokens-body');
      if (body) body.innerHTML = '<div style="color:var(--text-muted);font-size:11px;padding:4px 0;">Loading…</div>';
      parent.postMessage({ pluginMessage: { type: 'export-component-tokens' } }, '*');

    function hideComponentTokens() {
      var b = document.getElementById('component-tokens-body');
      if (b) b.innerHTML = '';
    }

    function renderComponentTokens(msg) {
      var body = document.getElementById('component-tokens-body');
      if (!body) return;
      var groups = msg.groups || [];

      if (groups.length === 0) {
        body.innerHTML = '<div style="color:var(--text-muted);font-size:11px;">' +
          (msg.selectionName === '' ? 'No selection — select a component first.' : 'No bound tokens found.') + '</div>';
        return;
      }

      var combinedJson = {};
      var totalTokens = 0;
      groups.forEach(function(g) {
        if (groups.length === 1) {
          g.tokens.forEach(function(t) { combinedJson[t.name] = t.value; });
        } else {
          var obj = {};
          g.tokens.forEach(function(t) { obj[t.name] = t.value; });
          combinedJson[g.name] = obj;
        }
        totalTokens += g.tokens.length;
      });
      var jsonStr = JSON.stringify(combinedJson, null, 2);

      function tokenRowsHtml(tokens) {
        return tokens.map(function(t) {
          var swatch = t.type === 'COLOR' ? '<span class="color-swatch" style="background:' + escHtml(t.value) + ';width:12px;height:12px;"></span>' : '';
          return '<div style="display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:11px;border-bottom:1px solid var(--border);">' +
            '<span class="var-type-badge var-type-' + t.type + '">' + (t.type === 'FLOAT' ? 'NUM' : t.type.slice(0,3)) + '</span>' +
            swatch +
            '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary);">' + escHtml(t.name) + '</span>' +
            '<span style="color:var(--text-muted);font-family:monospace;font-size:10px;">' + escHtml(t.value) + '</span>' +
            '</div>';
        }).join('');
      }

      var label = groups.length > 1
        ? totalTokens + ' token' + (totalTokens !== 1 ? 's' : '') + ' across ' + groups.length + ' components'
        : totalTokens + ' token' + (totalTokens !== 1 ? 's' : '') + ' in "' + escHtml(msg.selectionName) + '"';

      var html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
        '<span style="font-size:11px;color:var(--text-muted);">' + label + '</span>' +
        '<button onclick="hideComponentTokens()" style="font-size:10px;padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text-muted);cursor:pointer;">Hide</button>' +
        '</div>';

      if (groups.length === 1) {
        var g = groups[0];
        if (g.tokens.length === 0) {
          html += '<div style="color:var(--text-muted);font-size:11px;padding:4px 0;">No bound tokens found in "' + escHtml(g.name) + '".</div>';
        } else {
          html += '<div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;">' + tokenRowsHtml(g.tokens) + '</div>';
        }
      } else {
        groups.forEach(function(g) {
          if (g.tokens.length === 0) {
            html += '<div style="padding:4px 0;font-size:11px;color:var(--text-muted);">' + escHtml(g.name) + ': no bound tokens</div>';
            return;
          }
          html += '<details style="margin-bottom:4px;border:1px solid var(--border);border-radius:6px;overflow:hidden;">' +
            '<summary style="list-style:none;padding:7px 10px;background:var(--surface-subtle);cursor:pointer;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;user-select:none;">' +
              '<span style="flex:1;">' + escHtml(g.name) + '</span>' +
              '<span style="font-weight:400;color:var(--text-muted);">' + g.tokens.length + ' token' + (g.tokens.length !== 1 ? 's' : '') + '</span>' +
            '</summary>' +
            '<div style="max-height:150px;overflow-y:auto;">' + tokenRowsHtml(g.tokens) + '</div>' +
            '</details>';
        });
      }

      var cssStr = tokensJsonToCss(combinedJson);
      html += '<div style="display:flex;gap:6px;margin-top:8px;">' +
        '<button onclick="downloadTextFile(\'' + btoa(unescape(encodeURIComponent(jsonStr))) + '\', \'component-tokens.json\')" style="flex:1;padding:6px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--accent);cursor:pointer;">Download JSON</button>' +
        '<button onclick="copyToClipboard(\'' + cssStr.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n') + '\')" style="flex:1;padding:6px;font-size:11px;font-weight:600;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:white;cursor:pointer;">Copy as CSS</button>' +
        '</div>';

      body.innerHTML = html;
    }

    function tokensJsonToCss(obj) {
      var lines = [':root {'];
      function walk(o, prefix) {
        for (var k in o) {
          var key = prefix ? prefix + '-' + k : k;
          var cssKey = '--' + key.replace(/\//g, '-').replace(/[^a-zA-Z0-9-_]/g, '-').toLowerCase();
          if (o[k] !== null && typeof o[k] === 'object' && !Array.isArray(o[k])) {
            walk(o[k], key);
          } else {
            lines.push('  ' + cssKey + ': ' + o[k] + ';');
          }
        }
      }
      walk(obj, '');
      lines.push('}');
      return lines.join('\n');
    }

    function downloadTextFile(b64, filename) {
      try {
        var str = decodeURIComponent(escape(atob(b64)));
        var blob = new Blob([str], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
      } catch(e) {}
    }

    function mcpSetStatus(connected, message) {
      _mcp.connected = connected;
      var el = document.getElementById('mcp-status');
      if (!el) return;
      el.textContent = message || (connected ? 'Connected to Claude MCP server' : 'Disconnected');
      el.style.background = connected ? '#d8ffbb' : (message && message.indexOf('onnect') !== -1 && !connected ? 'var(--accent-bg)' : 'var(--surface)');
      el.style.color = connected ? '#223005' : 'var(--text-secondary)';
      el.style.border = connected ? '1px solid #a0e080' : '1px solid var(--border)';

        dot.classList.toggle('mcp-dot-live', connected);

      if (tip) tip.textContent = connected ? 'MCP server connected' : 'MCP server not connected';
      var cb = document.getElementById('mcp-connect-btn');
      var db = document.getElementById('mcp-disconnect-btn');
      if (cb) { cb.disabled = connected; cb.style.opacity = connected ? '0.5' : ''; cb.style.cursor = connected ? 'not-allowed' : ''; }
      if (db) { db.disabled = !connected; db.style.opacity = !connected ? '0.5' : ''; db.style.cursor = !connected ? 'not-allowed' : ''; }
    }

    function mcpConnect() {
      var portInput = document.getElementById('mcp-port-input');
      var port = portInput ? parseInt(portInput.value, 10) || 3055 : 3055;
      _mcp.port = port;
      if (_mcp.connected && _mcp.socket) { mcpSetStatus(true, 'Already connected'); return; }
      mcpClearRetry();
      mcpSetStatus(false, 'Connecting…');
      mcpAttemptConnect(port);
    }

    function mcpAttemptConnect(port) {
      if (_mcp.socket) { try { _mcp.socket.close(); } catch(e) {} _mcp.socket = null; }
      var wasConnected = false;
      var ws;
      try { ws = new WebSocket('ws://localhost:' + port); } catch(e) { mcpShowWaitingForServer(port); return; }
      _mcp.socket = ws;

      ws.onopen = function() {
        wasConnected = true;
        mcpClearRetry();
        var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
        var ch = '';
        for (var i = 0; i < 8; i++) ch += chars.charAt(Math.floor(Math.random() * chars.length));
        _mcp.channel = ch;
        ws.send(JSON.stringify({ type: 'join', channel: ch.trim() }));
      };

      ws.onmessage = function(event) {
        try {
          var data = JSON.parse(event.data);
          if (data.type === 'system' && data.message && data.message.result) {
            _mcp.connected = true;
            var ch = data.channel;
            mcpSetStatus(true, 'Connected on port ' + port);
            var el = document.getElementById('mcp-status');
            if (el) {
              el.style.cursor = '';
              el.onclick = null;
              el.innerHTML =
                '<div style="margin-bottom:6px;">Connected on port ' + port + '</div>' +
                '<div style="display:flex;align-items:center;gap:8px;">' +
                  '<code style="flex:1;font-size:13px;font-weight:700;letter-spacing:0.5px;background:rgba(0,0,0,0.15);padding:4px 8px;border-radius:4px;">' + ch + '</code>' +
                  '<button id="mcp-copy-btn" onclick="mcpCopyChannel(\'' + ch + '\')" style="background:none;border:1px solid currentColor;border-radius:4px;cursor:pointer;padding:3px 10px;font-size:11px;color:inherit;opacity:0.8;white-space:nowrap;transition:opacity 0.2s;">Copy ID</button>' +
                '</div>';
            }
          } else if (data.type === 'error') {
            mcpSetStatus(false, 'Error: ' + data.message);
            ws.close();
          }
          mcpHandleSocketMessage(data);
        } catch(e) { console.error('MCP parse error', e); }
      };

      ws.onerror = function() { /* onclose handles everything */ };

      ws.onclose = function() {
        _mcp.socket = null;
        if (wasConnected) {
          _mcp.connected = false;
          mcpSetStatus(false, 'Disconnected — reconnecting…');
          _mcp.retryTimer = setTimeout(function() { mcpAttemptConnect(port); }, 2000);
        } else {
          mcpShowWaitingForServer(port);
        }
      };
    }

    function mcpShowWaitingForServer(port) {

        '</div>' +

          '<span>Waiting for server to start…</span>' +
